# The speed budget: the most a benchmark may take, as the median time per
# call in nanoseconds over the repetitions (see docs/performance.md).
#
# phone_ns     what the game can afford on a mid-range phone: one simulated
#              millisecond in at most 5 % of one core, so 50 µs per step.
# ci_arm64_ns  the regression limit on CI's ARM runner: about twice what it
#              measured when the limit was set, so that a slower change
#              fails the build while the runner's own noise does not.
#              Set in October 2026 from the gcc and clang release jobs
#              (ubuntu-24.04-arm): 618, 577, 377 and 538 ns at the
#              slower.
#
# scripts/check_speed_budget.py compares a benchmark run with one column.

[BM_GameStep]
phone_ns = 50_000
ci_arm64_ns = 1_250

# One 60 fps frame through the game's session: 16 or 17 game steps and the
# two snapshots drawn between. On the phone, the same 50 µs per step.
[BM_SessionFrame]
phone_ns = 833_000
ci_arm64_ns = 22_000

[BM_PullStep]
ci_arm64_ns = 1_200

[BM_VehicleStep]
ci_arm64_ns = 800

# The most expensive step: a brake holding its side at rest runs the
# bracketed hold solve, up to eight more rear solves.
[BM_VehicleStepBrakeHeld]
ci_arm64_ns = 1_100
