name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: 18

jobs:
  build-test:
    name: ${{ matrix.compiler }} ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, release]
        include:
          - compiler: clang
            preset: asan-ubsan
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libclang-rt-${LLVM_VERSION}-dev

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CXX=clang++-${LLVM_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DTP_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Run engine dyno
        run: >
          ./build/${{ matrix.preset }}/tools/tp_pull engine-dyno
          data/engines/farm_stock_light.toml -o dyno.csv

      - name: Run clutch launches
        run: |
          for mode in "" --dump; do
            ./build/${{ matrix.preset }}/tools/tp_pull clutch-launch \
              data/engines/farm_stock_light.toml data/clutches/farm_stock_light.toml \
              $mode -o launch.csv
          done

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build clang-tidy-${LLVM_VERSION}

      - name: Configure
        env:
          CXX: clang++-${{ env.LLVM_VERSION }}
        run: cmake --preset debug

      - name: Run clang-tidy
        run: >
          run-clang-tidy-${LLVM_VERSION} -quiet -p build/debug
          -clang-tidy-binary clang-tidy-${LLVM_VERSION}
          "$PWD/(core|data_io|tests|tools|bench)/"

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-format-${LLVM_VERSION}

      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format-${LLVM_VERSION} --dry-run -Werror

  diagrams:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check rendered diagrams match their sources
        run: scripts/render_diagrams.sh --check

  # Shows changed diagrams as images in the PR conversation. Skipped for PRs
  # from forks, whose token cannot write comments.
  diagram-preview:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post or update the diagram preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/post_diagram_preview.sh
