# A firm, well-rolled loam: strong ground with good grip.

[track]
setup_tip = "Grippy: all the weights back stand it on the bar. Halfway, normal pressure."   # for the pit board
length_m = 100.0
max_duration_s = 120.0
lane_width_m = 12.0      # between the chalk lines; the NTTO's minimum prepared width
# How the track was prepared, a scale on its soil's grip (1 is the
# reference): well rolled loam, a grippy track. A strong tractor with
# its weights all back stands on its wheelie bar here: halfway pulls
# further, and soft tires' squirming lugs cost metres.
grip = 1.3

[track.soil]
clay_fraction = 0.4
moisture = 0.12
compaction = 0.9

# Hard spots (track::HardSpots): the rolled loam has firmer seams where the
# roller crossed. A well-prepared track has only a few, and mild: the sled's
# drag jumps a little as it crosses one, and the engine dips with it.
[track.hard_spots]
every_m = 5.0   # on average one every this far
length_m = 3.0       # patches from min_length_m to this long
min_length_m = 1.0
min_width_m = 1.0  # across the lane: from a patch under one wheel
max_width_m = 3.0  # to one under both rear sides; each lies somewhere across
extra = 0.25    # up to this much more drag at a spot's middle
seed = 23

# Weak spots (track::WeakSpots): a few looser patches.
# A well-prepared track has only a few, but one costs up to a fifth of
# the grip: the tires slip more for a moment, and a spot under one side
# turns a pulling tractor a little towards it.
[track.weak_spots]
every_m = 15.0
length_m = 3.0       # patches from min_length_m to this long
min_length_m = 1.0
min_width_m = 1.0  # across the lane: from a patch under one wheel
max_width_m = 3.0  # to one under both rear sides; each lies somewhere across
grip_loss = 0.2    # up to this share of the grip lost at a spot's middle
seed = 73
