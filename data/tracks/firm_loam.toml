# A firm, well-rolled loam: strong ground with good grip.

[track]
length_m = 100.0
max_duration_s = 120.0
lane_width_m = 12.0      # between the chalk lines; the NTTO's minimum prepared width
# How the track was prepared, a scale on its soil's grip (1 is the
# reference): well rolled loam, the grippiest track. Built tractors' front
# ends go high: the weights go forward here.
grip = 1.12

[track.soil]
clay_fraction = 0.4
moisture = 0.12
compaction = 0.9
