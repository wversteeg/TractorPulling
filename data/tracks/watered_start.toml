# The reference mix, with the first 30 m watered against the dust: the
# launch is softer and slicker than the rest of the track.

[track]
length_m = 100.0
max_duration_s = 120.0
lane_width_m = 12.0      # between the chalk lines; the NTTO's minimum prepared width

[track.soil]
clay_fraction = 0.55
moisture = 0.14
compaction = 0.8

[track.profile.moisture]
x_m = [0.0, 30.0, 35.0]
value = [0.20, 0.20, 0.14]
