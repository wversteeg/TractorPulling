# The reference mix, with the first 25 m watered against the dust: the
# launch is a little softer and slicker than the rest of the track. Damp, not wet:
# a strong tractor still pulls its usual gear or one lower, losing a few
# metres to the start.

[track]
setup_tip = "Wet at the start only: weights about halfway, and ease the clutch in."   # for the pit board
length_m = 100.0
max_duration_s = 120.0
lane_width_m = 12.0      # between the chalk lines; the NTTO's minimum prepared width
# How the track was prepared, a scale on its soil's grip (1 is the
# reference): as well prepared as the reference.
grip = 1.0

[track.soil]
clay_fraction = 0.55
moisture = 0.14
compaction = 0.8

[track.profile.moisture]
x_m = [0.0, 25.0, 30.0]
value = [0.16, 0.16, 0.14]
