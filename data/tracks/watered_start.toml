# The reference mix, with the first 30 m watered against the dust: the
# launch is softer and slicker than the rest of the track. Damp, not wet:
# a strong tractor still pulls its usual gear or one lower, losing a few
# metres to the start.

[track]
setup_tip = "Wet at the start: weights back for grip, and ease the clutch in."   # for the pit board
length_m = 100.0
max_duration_s = 120.0
lane_width_m = 12.0      # between the chalk lines; the NTTO's minimum prepared width
# How the track was prepared, a scale on its soil's grip (1 is the
# reference): as well prepared as the reference.
grip = 1.0

[track.soil]
clay_fraction = 0.55
moisture = 0.14
compaction = 0.8

[track.profile.moisture]
x_m = [0.0, 30.0, 35.0]
value = [0.18, 0.18, 0.14]

# Hard spots: where the water did not reach, the track dried in harder patches, so the sled's drag jumps as it crosses them (track::HardSpots).
[track.hard_spots]
every_m = 10.0   # on average one every this far
length_m = 1.5
extra = 0.35    # up to this much more drag at a spot's middle
seed = 53
