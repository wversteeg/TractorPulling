# A dry, hard-rolled clay track late on a hot day. Very strong: the tires
# hardly sink in and the sled's pan barely ploughs, but a layer of dust
# takes the edge off the grip.

[track]
setup_tip = "Grippy: all the weights back stand it on the bar. Halfway, normal pressure."   # for the pit board
length_m = 100.0
max_duration_s = 120.0
lane_width_m = 12.0      # between the chalk lines; the NTTO's minimum prepared width
# How the track was prepared, a scale on its soil's grip (1 is the
# reference): well prepared, a grippy track (its dust already costs grip in
# the soil model). A strong tractor with its weights all back stands on its
# wheelie bar here: halfway pulls further.
grip = 1.25

[track.soil]
clay_fraction = 0.75
moisture = 0.06
compaction = 0.95

# The sled operator brings the push-down earlier on this fast track (60 m,
# where the classes' sleds start it at 65 to 70 m).
[track.pushdown]
start_m = 60.0

# Hard spots (track::HardSpots): a dry, hard-rolled track breaks up into
# hard clods and firmer seams. A well-prepared track has only a few, and
# mild: the sled's drag jumps a little as it crosses one, and the engine
# dips with it.
[track.hard_spots]
every_m = 4.0   # on average one every this far
length_m = 1.2
min_width_m = 1.0  # across the lane: from a patch under one wheel
max_width_m = 6.0  # to a seam across half the lane; each lies somewhere in it
extra = 0.3    # up to this much more drag at a spot's middle
seed = 11   # mixed with each event's own: every season's events lay their own

# Weak spots (track::WeakSpots): dust the sweeper missed. A well-prepared
# track has only a few, and they are mild: the tires slip a little more for
# a moment.
[track.weak_spots]
every_m = 15.0
length_m = 1.5
min_width_m = 1.0  # across the lane: from a patch under one wheel
max_width_m = 3.0  # to one under both; each lies somewhere in it
grip_loss = 0.06   # up to this share of the grip lost at a spot's middle
seed = 79
