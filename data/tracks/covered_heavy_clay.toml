# A heavy clay track on a rainy day. The track was covered with plastic
# while it rained, so it is moist rather than wet: softer and stickier than
# the reference. A heavy track: the tires dig in and bite, the sled's pan
# ploughs deep, and the engine is pulled down until it stalls before the
# tires spin out.

[track]
setup_tip = "The nose climbs here: weights forward of halfway, soft tires."   # for the pit board
length_m = 100.0
max_duration_s = 120.0
lane_width_m = 12.0      # between the chalk lines; the NTTO's minimum prepared width
# How the track was prepared, a scale on its soil's grip (1 is the
# reference): the highest of the tracks, though the soil is soft. The cover
# kept the rain off, so the moist clay is sticky rather than slick: the
# lugs press into it and it holds them, where the dry tracks' dust and the
# loose sand let them slide. Soft, it also drags the sled hardest, so the
# pull is heavy. A strong tractor with its
# weights back climbs onto its wheelie bar here: the weights go forward
# (TrackSetup.OnHeavyClayTheWeightsGoForward), and soft tires pay.
grip = 1.45

[track.soil]
clay_fraction = 0.75
moisture = 0.19
compaction = 0.8

# Weak spots (track::WeakSpots): a softer, wetter patch under the cover's
# seams.
# A well-prepared track has only a few, but one costs up to a fifth of
# the grip: the tires slip more for a moment, and a spot under one side
# turns a pulling tractor a little towards it.
[track.weak_spots]
every_m = 15.0
length_m = 3.0       # patches from min_length_m to this long
min_length_m = 1.0
min_width_m = 1.0  # across the lane: from a patch under one wheel
max_width_m = 3.0  # to one under both rear sides; each lies somewhere across
grip_loss = 0.2    # up to this share of the grip lost at a spot's middle
seed = 67
