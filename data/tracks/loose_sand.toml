# A dry, sandy track, worked deeper further down. Weak and loose: the tires
# dig in once they spin, and the sled's pan ploughs.

[track]
length_m = 100.0
max_duration_s = 120.0

[track.soil]
clay_fraction = 0.05
moisture = 0.05
compaction = 0.25

# Rolled firmer at the start, looser from 40 m on.
[track.profile.compaction]
x_m = [0.0, 20.0, 40.0]
value = [0.45, 0.45, 0.25]
