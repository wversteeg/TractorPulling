# A light, sandy clay worked deeper further down: weaker than the
# reference, and the tires dig in once they spin.

[track]
setup_tip = "Loose sand: the grip runs out first, so all the weights back."   # for the pit board
length_m = 100.0
max_duration_s = 120.0
lane_width_m = 12.0      # between the chalk lines; the NTTO's minimum prepared width
# How the track was prepared, a scale on its soil's grip (1 is the
# reference): looser sandy topsoil grips least: the grip runs out first,
# so the weights go all back, for the most load on the rear tires.
grip = 0.92

[track.soil]
clay_fraction = 0.3
moisture = 0.10
compaction = 0.7

# Rolled firmer at the start, looser from 40 m on.
[track.profile.compaction]
x_m = [0.0, 20.0, 40.0]
value = [0.8, 0.8, 0.6]

# Weak spots (track::WeakSpots): looser sand the roller did not firm.
# A well-prepared track has only a few, but one costs up to a fifth of
# the grip: the tires slip more for a moment, and a spot under one side
# turns a pulling tractor a little towards it.
[track.weak_spots]
every_m = 15.0
length_m = 3.0       # patches from min_length_m to this long
min_length_m = 1.0
min_width_m = 1.0  # across the lane: from a patch under one wheel
max_width_m = 3.0  # to one under both rear sides; each lies somewhere across
grip_loss = 0.2    # up to this share of the grip lost at a spot's middle
seed = 71
