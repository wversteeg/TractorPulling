# A heavy clay track after rain, wettest in the middle where the water
# collected. Soft and slick: the tires sink in and smear the clay once
# they spin, and the sled's pan ploughs deep.

[track]
length_m = 100.0
max_duration_s = 120.0

[track.soil]
clay_fraction = 0.8
moisture = 0.22
compaction = 0.75

# Wetter from 30 to 70 m.
[track.profile.moisture]
x_m = [25.0, 35.0, 65.0, 75.0]
value = [0.22, 0.24, 0.24, 0.22]

# The sled operator sets the push-down later on this slow track.
[track.pushdown]
start_m = 70.0
pull_off_start_m = 60.0
