# The tractor path (docs/career.md): from the NTTO standard class up
# through the classes that still pull a recognisable tractor, all
# two-wheel drive. Each class has its own tractor, pulled at its levels
# (belofte, promo and top), each a season with its own field; the levels
# share the class's garage. The standard class, the warming-up, has one
# level; Sport 2.5 t, an introduction to the Sport classes, only promo and
# top.
#
# Finishing a level's championship first or second opens the next level
# at once, and the same at a class's last level the next class's first
# (`min_seasons = 1`: no level asks more than the season that earned it);
# the player is asked whether to move up or stay, and what is opened stays open. Money and upgrades
# carry over, by the upgrade's name.
#
# Standard 3.5 t, Sport 2.5 t and Sport 4.5 t so far. Supersport 3.4, 3.6
# and 4.5 t, Pro Stock, Limited Super Stock and Super Stock follow, a class
# at a time, each with its NTTO and ETPC rules.

[career]
name = "Tractor path"
promotion_place = 2   # the first two of the championship move up
min_seasons = 1       # a promotion opens the level above at once

[[career.classes]]
name = "Standard 3.5 t"
levels = [{ name = "Club", season = "../seasons/standard_3500.toml" }]

[[career.classes]]
name = "Sport 2.5 t"
levels = [
    { name = "Promo", season = "../seasons/sport_2500_promo.toml" },
    { name = "Top", season = "../seasons/sport_2500_top.toml" },
]

[[career.classes]]
name = "Sport 4.5 t"
levels = [
    { name = "Belofte", season = "../seasons/sport_4500_belofte.toml" },
    { name = "Promo", season = "../seasons/sport_4500_promo.toml" },
    { name = "Top", season = "../seasons/sport_4500_top.toml" },
]
