# The Sport class at 2.5 t, at top (topniveau), its highest level in the career
# (careers/tractor_path.toml): ten events, each on its own track. The
# pullers stay the same all season.

[season]
event = "../events/sport_2500_top.toml"   # the class and this level's field
seed = 3202                           # the field and every event's draws
points = [20, 17, 15, 14, 13, 12, 11, 10, 9, 8, 7, 6, 5, 4, 3]
# Prize money per place at every event [EUR]; the class's garage costs
# € 51,050 (garages/sport_2500.toml). Promo pays a fifth more than the
# standard class's top, top 30 % more than promo. Every place pays, the
# last at least half the garage's cheapest upgrade (one every two
# events), so a tractor at the back can still be built up; a disqualified
# pull earns nothing.
prize_money_eur = [2990, 2330, 1910, 1610, 1400, 1200, 1010, 900, 800, 690, 640, 580, 530, 470, 420]
garage = "../garages/sport_2500.toml"   # one tractor for the class's levels

[[season.events]]
name = "Spring opener, watered start"
track = "../tracks/watered_start.toml"

[[season.events]]
name = "Firm loam"
track = "../tracks/firm_loam.toml"

[[season.events]]
name = "Rainy day, covered heavy clay"
track = "../tracks/covered_heavy_clay.toml"

[[season.events]]
name = "Sandy clay"
track = "../tracks/sandy_clay.toml"

[[season.events]]
name = "Summer, dry hard clay"
track = "../tracks/dry_hard_clay.toml"

[[season.events]]
name = "Clay-sand"
track = "../tracks/ideal_clay_sand.toml"

[[season.events]]
name = "Dry hard clay again"
track = "../tracks/dry_hard_clay.toml"

[[season.events]]
name = "Firm loam, late summer"
track = "../tracks/firm_loam.toml"

[[season.events]]
name = "Autumn, covered heavy clay"
track = "../tracks/covered_heavy_clay.toml"

[[season.events]]
name = "Final, clay-sand"
track = "../tracks/ideal_clay_sand.toml"
