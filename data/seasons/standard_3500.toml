# The NTTO standard class, 3.5 t, the career's first class and its only
# level (careers/tractor_path.toml): ten events, each on its own track, as
# the club season. The pullers stay the same all season.

[season]
event = "../events/standard_3500.toml"   # the class and its field
seed = 3102                             # the field and every event's draws
points = [20, 17, 15, 14, 13, 12, 11, 10, 9, 8, 7, 6, 5, 4, 3]
# Prize money per place at every event [EUR]; the class's garage costs
# about € 20,000 (garages/standard_3500.toml). The career's start pays
# well, so the first upgrades come quickly: a player who buys as they earn
# wins the class in about two seasons, the career's minimum. Every place
# pays, the 15th a cheap upgrade (€ 250), so a new tractor at the back can
# still be built up; a disqualified pull earns nothing.
prize_money_eur = [1860, 1440, 1180, 1000, 870, 740, 620, 560, 490, 430, 400, 360, 330, 290, 260]
garage = "../garages/standard_3500.toml"

[[season.events]]
name = "Spring opener, watered start"
track = "../tracks/watered_start.toml"

[[season.events]]
name = "Firm loam"
track = "../tracks/firm_loam.toml"

[[season.events]]
name = "Rainy day, covered heavy clay"
track = "../tracks/covered_heavy_clay.toml"

[[season.events]]
name = "Sandy clay"
track = "../tracks/sandy_clay.toml"

[[season.events]]
name = "Summer, dry hard clay"
track = "../tracks/dry_hard_clay.toml"

[[season.events]]
name = "Clay-sand"
track = "../tracks/ideal_clay_sand.toml"

[[season.events]]
name = "Dry hard clay again"
track = "../tracks/dry_hard_clay.toml"

[[season.events]]
name = "Firm loam, late summer"
track = "../tracks/firm_loam.toml"

[[season.events]]
name = "Autumn, covered heavy clay"
track = "../tracks/covered_heavy_clay.toml"

[[season.events]]
name = "Final, clay-sand"
track = "../tracks/ideal_clay_sand.toml"
