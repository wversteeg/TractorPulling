# The pulling sled (pulling_sled.toml) set for the class.
[sled]
base = "pulling_sled.toml"

# The box starts just behind the wheels and the pan's back half is held
# up off the track: a new tractor gets the sled going on the watered start
# too.
[sled.weight_box]
travel_distance_m = 90.0
mass_kg = 11000.0
start_ahead_of_wheels_m = -0.68

# The pan drops at 55 m and the push-down takes it to 65 % of the sled.
[sled.pushdown]
most_pan_share = 0.65
pan_held_share = 0.5
start_m = 55.0
