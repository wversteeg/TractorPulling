# The pulling sled (pulling_sled.toml) set for the class.
[sled]
base = "pulling_sled.toml"

# At the start the box stands at the frame's tail, 4 m behind the wheels,
# where it takes some of the frame's weight off the pan, and one knife
# cuts: a new farm tractor on its farm drawbar (0.40 m) and worn tires
# gets the 15 t sled going, on a wet start too. (Any further back with
# this box and the sled would sit on its tail.)
[sled.weight_box]
mass_kg = 1800.0
start_ahead_of_wheels_m = -0.65

# The push-down from 70 m takes the pan to 40 % of the sled: the farm
# tractors are alike, and a lower top to the drag spreads them by what
# their engines and tires hold.
[sled.pushdown]
start_m = 50.0
most_pan_share = 0.5

[sled.knives]
count = 1
