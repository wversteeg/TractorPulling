# The pulling sled (pulling_sled.toml) set for the class.
[sled]
base = "pulling_sled.toml"

# The box starts just behind the wheels and the pan's back half is held up
# off the track until the push-down starts: a new farm tractor on its farm
# drawbar (0.40 m) and worn tires gets the 15 t sled going, on a wet start
# too.
[sled.weight_box]
mass_kg = 2200.0
start_ahead_of_wheels_m = -0.65

# The pan drops at 65 m and the push-down takes it to 40 % of the sled:
# the farm tractors are alike, and a lower top to the drag spreads them by
# what their engines and tires hold.
[sled.pushdown]
pan_held_share = 0.5
start_m = 65.0
most_pan_share = 0.4

[sled.knives]
count = 1
