# Transfer sled set up for the light farm-stock class (NTTO standard 3.5 t).
# Lengths along the sled are measured forward from the rear wheels' contact.
# Masses, friction, knives and the push-down are the class's starting
# setting; on the day the sled operator adjusts it after the test pull. The
# push-down takes the wheels off gradually over 30 m, so the drag keeps
# rising down the track and a stronger pull gets measurably further. On the
# reference track the reference tractor gets about 93 m in gear 6.

[sled]
frame_mass_kg = 3200.0
frame_cg_ahead_of_wheels_m = 0.75
pan_ahead_of_wheels_m = 3.0          # centre of the pan's contact
pan_friction_coefficient = 0.46      # steel sliding on a firm track
pan_area_m2 = 1.8                    # the pan's contact with the track
pan_plough_coefficient = 5.0         # extra drag per unit of pressure / cone index

# The rear wheels (16.9-24 class) roll as towed tires on the track's soil.
[sled.wheels]
count = 2
radius_m = 0.55
section_width_m = 0.43
section_height_m = 0.35
deflection_m = 0.04

[sled.hook]
ahead_of_wheels_m = 3.3
height_m = 0.45                      # 0.40 to 0.50 m, depending on the sled

[sled.weight_box]
mass_kg = 1500.0
start_ahead_of_wheels_m = 0.0        # over the rear wheels
end_ahead_of_wheels_m = 3.0          # over the pan
travel_distance_m = 100.0            # sled travel to move it from start to end

# Engages at a set distance on the track, chosen per event from the test
# pull and the track's state (for example 60 or 80 m).
[sled.pushdown]
start_m = 60.0
ramp_m = 30.0                        # travel until the wheels are fully off

[sled.chain]
length_m = 1.15                      # 1.1 to 1.2 m
stiffness_n_per_m = 2.0e6            # chain, shackles and hitch
damping_n_s_per_m = 15000.0

# Knives under the pan cut grooves in the track; the sled operator sets
# how many and how deep.
[sled.knives]
count = 4
depth_m = 0.04
width_m = 0.05

# After the full pulls, the qualifiers pull off on a heavier sled: as many
# of these steps as the sled operator judges they need. One step costs the
# reference tractor about 5 m.
[sled.pull_off_step]
box_mass_kg = 0.0
knives = 1
knife_depth_m = 0.0
pushdown_earlier_m = 0.0
