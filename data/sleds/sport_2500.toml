# The pulling sled (pulling_sled.toml) set for the class.
[sled]
base = "pulling_sled.toml"

# At the start the box stands just behind the wheels and the pan's back
# half is held up off the track: a new Sport tractor gets the 15 t sled
# going on a loose or wet track too. Its gearbox one gear earlier than the
# base's: the box at the front by 85 m, so only a nearly built tractor
# wins at the top level.
[sled.weight_box]
mass_kg = 1800.0
start_ahead_of_wheels_m = -0.65
travel_distance_m = 85.0

# The pan drops at 60 m and the push-down takes it to 55 % of the sled.
[sled.pushdown]
pan_held_share = 0.5
start_m = 60.0
most_pan_share = 0.55
