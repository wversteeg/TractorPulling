# The pulling sled (pulling_sled.toml) set for the Supersport 3.6 t class.
# Its puller tires grip about as real ones do, about their load at full
# bite (tires/supersport_puller_rear.toml), and spin fast on the engine's
# power: the class's sled drags about 25 to 35 kN halfway and 50 to 70 kN
# at the end, as top tractors meet it, with less in the box than the
# Sport 4.5 t's.
[sled]
base = "pulling_sled.toml"

[sled.weight_box]
mass_kg = 3000.0
start_ahead_of_wheels_m = -0.75

# The push-down from 70 m takes the pan to half the sled (the base's).
[sled.pushdown]
start_m = 70.0
