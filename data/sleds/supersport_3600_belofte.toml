# The pulling sled (pulling_sled.toml) set for the Supersport 3.6 t
# belofte (events/supersport_3600_belofte.toml): its tractors pull on farm
# tires, which grip less than puller tires, so the sled starts lighter, its
# box half the top events' (supersport_3600.toml) and further back, more of
# its weight on the sled's wheels. A new tractor on farm tires gets about
# 40 m on the loose sandy clay and about 100 m on the reference clay-sand;
# the sled operator sets it for the day's field from there.
[sled]
base = "pulling_sled.toml"

[sled.weight_box]
mass_kg = 1500.0
start_ahead_of_wheels_m = -1.5

# The push-down from 70 m takes the pan to half the sled (the base's).
[sled.pushdown]
start_m = 70.0
