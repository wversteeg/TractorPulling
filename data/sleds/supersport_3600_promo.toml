# The pulling sled (pulling_sled.toml) set for the Supersport 3.6 t
# promotion events (events/supersport_3600_promo.toml): between the
# belofte's (supersport_3600_belofte.toml) and the top events'
# (supersport_3600.toml), its box lighter and further back than the top's.
[sled]
base = "pulling_sled.toml"

[sled.weight_box]
mass_kg = 2500.0
start_ahead_of_wheels_m = -1.0

# The push-down from 70 m takes the pan to half the sled (the base's).
[sled.pushdown]
start_m = 70.0
