# The Sport 4.5 t tractor's rear tire: a farm tire cut for pulling (cut
# tires, not puller tires, in the NTTO's Sport classes; docs/career.md) at
# the class's widest, 30.5" (775 mm) on a 32" rim: a 30.5L-32, bigger
# round and wider than the 2.5 t tractor's (sport_rear.toml). The garage
# (garages/sport_4500.toml) takes its grip from worn farm tires to hand
# cut ones.
#
# Cut, the farm tire's lugs bite harder than an uncut tire's, build their
# grip with more slip and do not smear spun fast (see sport_rear.toml).
# The limit is the fully built tire's; the garage sets it.
[tire]
tread = "cut"                      # the pattern drawn (the grip is in [tire.traction])
radius_m = 0.88                    # rolling radius
section_width_m = 0.78
section_height_m = 0.48
deflection_m = 0.06                # sidewall deflection at working load
wheel_inertia_kg_m2 = 60.0         # wheel, rim and tire about the axle
min_reference_speed_m_s = 0.5      # keeps the slip ratio defined at rest

[tire.traction]
limit = 1.4                        # μ on very strong ground at full bite: a hand cut farm tire on a prepared track
mobility_rate = 0.1                # how fast grip reaches the limit with Bn
slip_rate = 6.0                    # cut lugs: grip builds with more slip than an uncut farm tire's
# Cut lower and sharper, the lugs no longer dig in and smear when spun
# fast as an uncut farm tire's do (pulling_rear.toml): no fast_spin_grip
# (tp::tire::TractionCurve), so grip keeps up however fast it spins.
# Pressed harder than its share of the tractor at rest (the chain pulling
# down at the hitch, the weights back), the tire grips less per unit of
# load (tp::tire::TractionCurve::load_sensitivity).
load_sensitivity = 0.3
reference_load_n = 15900.0          # where the sensitivity starts: about one tire's share at rest as built
# On ground stronger than the lugs press into it, they ride on their tips
# and grip less (tp::tire::lug_grip). Cut sharper than an uncut farm
# tire's, they sink into all but the dry hard clay.
lug_bearing_mpa = 2.5
unsunk_lug_grip = 0.5

# The inflation pressure the puller sets before a pull (see
# tp::tire::Pressure): lower deflects the tire more, for a bigger footprint
# that grips better on soft ground, but lets the lugs squirm, which costs
# grip on firm ground; harder than the reference only shrinks the
# footprint. deflection_m above is at the reference pressure.
[tire.pressure]
reference_bar = 0.6                # a cut farm tire pulled soft
min_bar = 0.3
max_bar = 1.0
lug_squirm = 0.5                   # traction limit lost per unit of extra deflection / section height
# A soft carcass's lugs fold the more the faster they are spun: the squirm
# costs lug_squirm's share at this slip speed, less turning slowly and more
# spun fast [m/s].
squirm_speed_m_s = 5.0
# The carcass's rolling losses per unit of deflection over the section
# height, against the reference's: soft it flexes and rolls harder, hard it
# rolls easier, which counts on firm ground.
carcass_loss = 0.12

# Side grip (see tp::tire::Cornering). Starting values to tune: a big lugged
# tire builds side force a little more slowly than the front tires and
# holds a bit more of its load sideways. Traction uses up side grip, and a
# spinning tire has almost none.
[tire.cornering]
stiffness_per_rad = 4.0            # side force per unit of load per rad of slip angle
limit = 0.8                        # side force per unit of load at most
mobility_rate = 0.1                # as for traction: soft ground grips less
relaxation_length_m = 0.88         # about the tire's radius

# Spinning on the spot, the lugs dig the tire a hole within a few metres
# of slip, and it has to climb out of it (tp::tire::Digging).
[tire.digging]
rate = 0.005                       # m of depth per m of slip, standing
escape_speed_m_s = 0.5             # moving faster than about this, it hardly digs
