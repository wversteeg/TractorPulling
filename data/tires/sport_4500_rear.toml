# The Sport 4.5 t tractor's rear tire: a puller tire (cut tread allowed
# from Sport on) at the class's widest, 30.5" (775 mm) on a 32" rim
# (docs/career.md): a 30.5L-32, bigger round and wider than the 2.5 t
# tractor's (sport_rear.toml). The garage (garages/sport_4500.toml) takes
# its grip from worn farm tires to cut puller tires.
#
# A puller tire grips harder than a farm tire, but only spinning: its cut
# lugs bite as they dig, so grip builds slowly with slip (slip_rate a third
# of a farm tire's) to a higher limit. It spins at the launch, so the engine
# keeps its revs, and grips hard late in the pull, where a gear too tall
# for a grippy track bogs the engine. The limit is the fully built tire's;
# the garage sets it.
[tire]
radius_m = 0.88                    # rolling radius
section_width_m = 0.78
section_height_m = 0.48
deflection_m = 0.06                # sidewall deflection at working load
wheel_inertia_kg_m2 = 60.0         # wheel, rim and tire about the axle
min_reference_speed_m_s = 0.5      # keeps the slip ratio defined at rest

[tire.traction]
limit = 1.4                        # μ on very strong ground at full bite: a cut puller tire
mobility_rate = 0.1                # how fast grip reaches the limit with Bn
slip_rate = 6.0                    # grip builds slowly with slip: a puller tire bites spinning hard

# The inflation pressure the puller sets before a pull (see
# tp::tire::Pressure): lower deflects the tire more, for a bigger footprint
# that grips better on soft ground, but lets the lugs squirm, which costs
# grip on firm ground; harder than the reference only shrinks the
# footprint. deflection_m above is at the reference pressure.
[tire.pressure]
reference_bar = 1.0
min_bar = 0.5
max_bar = 1.6
lug_squirm = 0.5                   # traction limit lost per unit of extra deflection / section height

# Side grip (see tp::tire::Cornering). Starting values to tune: a big lugged
# tire builds side force a little more slowly than the front tires and
# holds a bit more of its load sideways. Traction uses up side grip, and a
# spinning tire has almost none.
[tire.cornering]
stiffness_per_rad = 4.0            # side force per unit of load per rad of slip angle
limit = 0.8                        # side force per unit of load at most
mobility_rate = 0.1                # as for traction: soft ground grips less
relaxation_length_m = 0.88         # about the tire's radius
