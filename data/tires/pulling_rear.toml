# Large rear tractor tire on a prepared pulling track, which grips better
# than a field: traction peaks at μ 0.95 at 20 % slip and full wheelspin
# keeps about 80 % of it. With this grip the light class pulls on engine
# torque in its pulling gears (6 and 7) and only spins out in low gears.

[tire]
radius_m = 0.8
nominal_load_n = 10000.0           # per tire; the traction table applies here
load_sensitivity = 0.1             # μ loss per unit of load above nominal
rolling_resistance_coefficient = 0.06
wheel_inertia_kg_m2 = 30.0         # wheel, rim and tire about the axle
min_reference_speed_m_s = 0.5      # keeps the slip ratio defined at rest

[tire.traction]
slip = [0.0, 0.05, 0.12, 0.2,  0.4,  1.0]
mu   = [0.0, 0.5,  0.88, 0.95, 0.88, 0.78]
