# The Sport 2.5 t tractor's rear tire: a 24.5" (620 mm) farm tire cut for
# pulling. The NTTO's Sport classes allow cut tires but not puller tires
# (which the ETPC allows from Sport on; the game follows the NTTO, so
# puller tires come from Supersport; docs/career.md). As the standard
# class's farm tire (pulling_rear.toml) but wider and a little smaller
# round, for a 2.5 t tractor; the garage (garages/sport_2500.toml) takes
# its grip from worn farm tires to hand cut ones.
#
# A farm tire's few tall lugs each push against a block of soil. Cut, they
# bite harder than an uncut tire's and build their grip with a little more
# slip (slip_rate under half the uncut tire's), so the tire still spins up
# at the launch; spun fast, the lugs dig in and smear, and some grip goes
# (fast_spin_grip). The limit is the fully built tire's; the garage sets
# it.
[tire]
radius_m = 0.78                    # rolling radius
section_width_m = 0.62
section_height_m = 0.4
deflection_m = 0.05                # sidewall deflection at working load
wheel_inertia_kg_m2 = 32.0         # wheel, rim and tire about the axle
min_reference_speed_m_s = 0.5      # keeps the slip ratio defined at rest

[tire.traction]
limit = 1.4                        # μ on very strong ground at full bite: a hand cut farm tire on a prepared track
mobility_rate = 0.1                # how fast grip reaches the limit with Bn
slip_rate = 8.0                    # cut lugs: grip builds with more slip than an uncut farm tire's
# Spun fast, the tall lugs dig in and smear: grip falls to fast_spin_grip
# of itself as the tread's slip speed passes spin_speed_m_s
# (tp::tire::TractionCurve).
fast_spin_grip = 0.9
spin_speed_m_s = 4.0

# The inflation pressure the puller sets before a pull (see
# tp::tire::Pressure): lower deflects the tire more, for a bigger footprint
# that grips better on soft ground, but lets the lugs squirm, which costs
# grip on firm ground; harder than the reference only shrinks the
# footprint. deflection_m above is at the reference pressure.
[tire.pressure]
reference_bar = 1.0
min_bar = 0.5
max_bar = 1.6
lug_squirm = 0.5                   # traction limit lost per unit of extra deflection / section height

# Side grip (see tp::tire::Cornering). Starting values to tune: a big lugged
# tire builds side force a little more slowly than the front tires and
# holds a bit more of its load sideways. Traction uses up side grip, and a
# spinning tire has almost none.
[tire.cornering]
stiffness_per_rad = 4.0            # side force per unit of load per rad of slip angle
limit = 0.8                        # side force per unit of load at most
mobility_rate = 0.1                # as for traction: soft ground grips less
relaxation_length_m = 0.78         # about the tire's radius
