# The Sport 2.5 t class's tractor (docs/career.md): a small farm tractor
# built for pulling, no cab but a roll bar, its engine, clutch and gears
# uprated (engines/, clutches/, drivelines/sport_2500.toml) and puller
# tires (tires/sport_rear.toml). Within the class: 2500 kg with the driver,
# a wheelbase under 2.6 m, nothing more than 3.5 m ahead of the rear axle,
# the hitch at most 0.5 m high and at least 0.45 m behind the axle. The
# garage (garages/sport_2500.toml) builds it from a stock tractor.

[tractor]
engine = "../engines/sport_2500.toml"
clutch = "../clutches/sport_2500.toml"
driveline = "../drivelines/sport_2500.toml"
rear_tire = "../tires/sport_rear.toml"
rear_tire_count = 2
pto_efficiency = 0.9              # crankshaft to PTO

# One of the two unpowered front tires (10.0-20 class).
[tractor.front_tire]
radius_m = 0.45
section_width_m = 0.25
section_height_m = 0.22
deflection_m = 0.022

[tractor.steering]
max_angle_deg = 40.0

[tractor.steering.cornering]
stiffness_per_rad = 5.0
limit = 0.7
mobility_rate = 0.1
relaxation_length_m = 0.45        # about the tire's radius

[tractor.brakes]
max_torque_nm = 6000.0            # per side, at the wheels

# Body points are measured with the tractor level. The rear axle height is
# the rear tire's radius.
[tractor.chassis]
mass_kg = 2500.0                  # with the driver and all 300 kg of weights
wheelbase_m = 2.2                 # the class allows 2.6 m
cg_ahead_of_rear_axle_m = 0.62    # 72 % of the weight on the rear axle at rest, the weights halfway
cg_height_m = 0.9
pitch_inertia_kg_m2 = 1600.0      # about the centre of gravity; m k², k ≈ 0.8 m
yaw_inertia_kg_m2 = 3300.0        # about the centre of gravity; m (l² + w²) / 12, 3.4 m by 2.0 m
rear_track_m = 1.75
front_track_m = 1.5
hitch_height_m = 0.5              # the class's limit, not above the rear axle
hitch_behind_rear_axle_m = 0.45   # the class's shortest drawbar
protection = "roll_bar"           # no cab: an ETPC roll bar (60 x 60 x 4 mm up to 2500 kg)

# Weights the puller moves before a pull: from a weight carrier behind the
# rear axle to the front bracket, 2.8 m ahead of it (the class allows
# 3.5 m). Built for pulling, the tractor is light at the front: with the
# weights halfway it lifts its front on a hard launch, with them at the
# back (82 % on the rear axle) it climbs onto its wheelie bar and stands
# up again as the sled gets heavy, and with them at the front (62 %) it
# stays down. The track's grip decides how high it goes.
[tractor.chassis.ballast]
mass_kg = 300.0
rear_ahead_of_rear_axle_m = -0.75  # by the hitch, at the rear tires' edge (ETPC FS 2026 1.2.2: none beyond the rear tires)
front_ahead_of_rear_axle_m = 2.8
position = 0.5

[tractor.chassis.front_tires]
stiffness_n_per_m = 300000.0
damping_n_s_per_m = 4500.0        # about 15 % of critical in pitch

# Mandatory (ETPC FS 2026, 1.2.4, Level 2 and 3): at least half a tire
# diameter behind the rear axle, its pad at most 250 mm off the ground and
# at least 15000 mm² (a skid, not a wheel). Close behind the rear tire
# and its pad at the height limit, as pullers set it: the tip touches
# down at about 17° nose-up, and the pad slides.
[tractor.chassis.wheelie_bar]
behind_rear_axle_m = 0.95
tip_height_m = 0.25
stiffness_n_per_m = 3.2e6         # 2.0e6 × (1.2 / 0.95)², as stiff in pitch as at 1.2 m
damping_n_s_per_m = 64000.0
rolling_resistance_coefficient = 0.35  # a steel pad sliding on the track
