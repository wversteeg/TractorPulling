# The Sport 4.5 t class's engine (NTTO/ETPC Sport, 4500 kg; docs/career.md):
# a six-cylinder turbo diesel of at most 7.0 l with two valves a cylinder,
# one turbo, its air inlet at most 68 mm, an intercooler (allowed with the
# restrictor), 2700 rpm unloaded.
# The rules set no power. The curve below is the fully built engine, about
# 780 hp (585 kW) at 2500 rpm, set from videos of the class's top tractors
# (about 115 m in a pull-off in about 15 s on an ordinary track): 110 hp a
# litre, run rich on boost for pulls of seconds. The garage
# (garages/sport_4500.toml) starts it at about 35 % of this torque, a stock
# 7 l farm engine's 270 hp, and builds it up.
# Speeds are in rpm and converted to rad/s on load.

[engine]
inertia_kg_m2 = 2.0      # crankshaft and flywheel of a 7 l six
idle_rpm = 800
rated_rpm = 2500         # the governor as built; the garage sets it
high_idle_rpm = 2700     # the class's unloaded limit
stall_rpm = 450
cylinders = 6            # a six: for the engine's sound only

[engine.friction]
constant_nm = 25.0
viscous_nm_per_1000_rpm = 14.0

# The turbo: a big one for the 68 mm inlet, little boost low down.
[engine.turbo]
na_torque_fraction = 0.45
time_constant_s = 1.1
boost_onset_rpm = 1100
full_boost_rpm = 1800
full_boost_bar = 2.5          # above the atmosphere (about 3.5 bar absolute), for the boost gauge

# Full-load torque at full boost: peak 2410 N·m at 2000 rpm, about 585 kW
# (780 hp) from 2400 rpm; past the rated speed the engine's own fall-off.
[engine.torque_curve]
rpm       = [800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400, 2600, 2800, 3000]
torque_nm = [1100, 1320, 1620, 1980, 2240, 2385, 2410, 2370, 2295, 2190, 2025, 1840]
