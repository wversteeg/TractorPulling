# The Supersport 3.6 t class's small engine (ETPC FS 2026, Level 3;
# docs/career.md): a six-cylinder turbo diesel of at most 6063 cm³ with 4
# valves a cylinder, allowed to 3200 rpm unloaded (with the Level 3 safety
# frame and certified clutch the class's tractors have). The rules set no
# power. The curve below is the fully built engine, a game estimate: about
# the big engine's power (engines/supersport_3600_7l.toml, 1000 hp), made
# 500 rpm higher with a fifth less torque, and lighter. Less torque low
# down bogs sooner on a heavy track; more revs and a lighter crankshaft
# spin the tires up and keep the power over a wider band of speeds, where
# a tire spins and grips again. Geared for its speed (a final drive about
# a fifth lower), it pulls best where the tires spin. The garage starts it
# at about 35 % of this torque.
# Speeds are in rpm and converted to rad/s on load.

[engine]
inertia_kg_m2 = 1.5      # a lighter crankshaft and flywheel
idle_rpm = 900
rated_rpm = 2600         # full fuel to here as it comes; the garage sets it
high_idle_rpm = 2800     # the governor's cut-off as it comes
max_high_idle_rpm = 3200 # the class's unloaded limit for the 6063 cm³ engine
stall_rpm = 500
cylinders = 6            # a six: for the engine's sound only

[engine.friction]
constant_nm = 24.0
viscous_nm_per_1000_rpm = 12.0

# The turbo: a big one too, spinning up a little higher.
[engine.turbo]
na_torque_fraction = 0.4
time_constant_s = 1.1
boost_onset_rpm = 1300
full_boost_rpm = 2200
full_boost_bar = 3.0          # above the atmosphere, for the boost gauge

# Full-load torque at full boost: peak 2620 N·m at 2300 rpm, about 750 kW
# (1000 hp) from 2900 to 3200 rpm.
[engine.torque_curve]
rpm       = [800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400, 2600, 2800, 3000, 3200, 3400]
torque_nm = [1000, 1200, 1450, 1750, 2050, 2300, 2480, 2600, 2620, 2580, 2500, 2400, 2260, 2080]
