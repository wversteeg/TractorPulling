# The Supersport 3.6 t tractor's driveline with the tall final drive, for
# puller tires on a built tractor (garages/supersport_3600.toml, the final
# drive choice): about 54 to 81 km/h at the wheel in the pulling gears at
# 3200 rpm on the 0.88 m tires (46 to 69 km/h at 2700 rpm), the wheel
# speeds a top Supersport pull spins at. The rivals pull on it in 5th and
# 6th, geared for wheel speed (tractors/supersport_3600.toml): in 6th a
# top pull spins the wheels at 65 to 80 km/h through the middle of a firm
# track (tests/data/tire_choice_test.cpp). A stock engine cannot spin the
# tires that fast: it pulls further on the middle final drive
# (FinalDrive tests in tests/data/tire_choice_test.cpp). Taller would only
# burn power in slip: at the same power the tires pull less the faster
# they turn (F = P / v), and a fully built engine already reaches the
# puller tire's best slip in 6th here.
# The gearbox is the tractor's own case (ETPC FS 2026 1.3.3: the OEM
# transmission and final drive housings stay; their gears may be
# machined), set up as pullers do: 1st and 2nd to manoeuvre, 3rd to 6th
# close pulling gears about 13 % apart, the driver picking one for the
# day's track and pulling it through without a shift (no powershift from
# Supersport on).

[driveline]
final_drive_ratio = 14.5       # bevel gear and planetaries together
efficiency = 0.90              # all meshes, applied in the direction power flows
input_inertia_kg_m2 = 0.08     # clutch disc, input shaft, countershaft
output_inertia_kg_m2 = 3.5     # final drive and axle; wheels belong to the tires

[driveline.gearbox]
ratios = [4.0, 2.4, 1.35, 1.18, 1.03, 0.90]   # 1st and 2nd to manoeuvre, 3rd to 6th to pull
reverse = 3.85

[driveline.drag]                # churning and bearings, on the input shaft
constant_nm = 3.0
viscous_nm_per_1000_rpm = 1.05
