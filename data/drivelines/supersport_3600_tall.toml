# The Supersport 3.6 t tractor's driveline with the tall final drive, for
# puller tires (garages/supersport_3600.toml, the final drive choice). The
# gearbox is the tractor's own case (ETPC FS 2026 1.3.3: the OEM
# transmission and final drive housings stay; their gears may be
# machined), set up as pullers do: 1st and 2nd to manoeuvre, 3rd to 6th
# close pulling gears about 13 % apart, the driver picking one for the
# day's track and pulling it through without a shift (no powershift from
# Supersport on). The final drive puts that pulling range where the rear
# tires want it: a puller tire bites harder the faster it spins, so it
# wants the wheels turning fast at the governor, about 29 to 43 km/h in
# the pulling gears at 2700 rpm on the 0.88 m tires.

[driveline]
final_drive_ratio = 23.0       # bevel gear and planetaries together
efficiency = 0.90              # all meshes, applied in the direction power flows
input_inertia_kg_m2 = 0.08     # clutch disc, input shaft, countershaft
output_inertia_kg_m2 = 3.5     # final drive and axle; wheels belong to the tires

[driveline.gearbox]
ratios = [4.0, 2.4, 1.35, 1.18, 1.03, 0.90]   # 1st and 2nd to manoeuvre, 3rd to 6th to pull
reverse = 3.85

[driveline.drag]                # churning and bearings, on the input shaft
constant_nm = 3.0
viscous_nm_per_1000_rpm = 1.05
