# The Sport 4.5 t tractor's driveline: a farm gearbox geared up for the
# built engine. The tall pulling gears, 5th to 8th, are close (about
# 15 % apart): at 2600 rpm on the 0.88 m rear tires
# (tires/sport_4500_rear.toml) the wheels turn at about 28 to 42 km/h, the
# tractor going slower on its wheelspin. Too tall a gear for the track
# bogs the engine, too low a gear spins out. 1st to 5th are about 40 %
# apart, so 3rd and 4th are the low gears for a wet start or a weak
# engine. A two-gear powershift step, as fully built (the garage sets it;
# the Sport classes still have one, Supersport and up do not).

[driveline]
final_drive_ratio = 24.0       # bevel gear and final reduction together
efficiency = 0.90              # all meshes, applied in the direction power flows
input_inertia_kg_m2 = 0.08     # clutch disc, input shaft, countershaft
output_inertia_kg_m2 = 3.5     # final drive and axle; wheels belong to the tires

[driveline.gearbox]
ratios = [5.0, 3.57, 2.55, 1.82, 1.30, 1.13, 0.98, 0.85]   # 1st to 8th, about 40 % apart up to 5th, 15 % above
reverse = 3.85                 # ~9 km/h at 2500 rpm, ~3 km/h at idle: less is the throttle

# A powershift step: one or two gears down under load, the clutch in,
# when the engine is pulled down near the end of a pull; once a pull (see
# drivelines/farm_stock_light.toml).
[driveline.powershift]
load_downshift_gears = 2
shifts_per_pull = 1

[driveline.drag]                # churning and bearings, on the input shaft
constant_nm = 3.0
viscous_nm_per_1000_rpm = 1.05  # ~0.01 N·m per rad/s
