# The Supersport 3.6 t tractor's driveline with the middle final drive,
# for puller tires on a stock tractor (garages/
# supersport_3600.toml, the final drive choice; the tall one is
# supersport_3600_tall.toml): about 35 to 52 km/h at the wheel in the
# pulling gears at 3200 rpm on the 0.88 m tires (29 to 44 km/h at
# 2700 rpm), between the farm tires' short drive and the tall one. A stock
# engine spins the puller tires up best here; a fully built one runs out
# of gears (it pulls in 6th) and pulls further on the tall drive. Half
# built, the two pull about alike.
# The gearbox is the tractor's own case (ETPC FS 2026 1.3.3: the OEM
# transmission and final drive housings stay; their gears may be
# machined), set up as pullers do: 1st and 2nd to manoeuvre, 3rd to 6th
# close pulling gears about 13 % apart, the driver picking one for the
# day's track and pulling it through without a shift (no powershift from
# Supersport on).

[driveline]
final_drive_ratio = 22.5       # bevel gear and planetaries together
efficiency = 0.90              # all meshes, applied in the direction power flows
input_inertia_kg_m2 = 0.08     # clutch disc, input shaft, countershaft
output_inertia_kg_m2 = 3.5     # final drive and axle; wheels belong to the tires

[driveline.gearbox]
ratios = [4.0, 2.4, 1.35, 1.18, 1.03, 0.90]   # 1st and 2nd to manoeuvre, 3rd to 6th to pull
reverse = 3.85

[driveline.drag]                # churning and bearings, on the input shaft
constant_nm = 3.0
viscous_nm_per_1000_rpm = 1.05
