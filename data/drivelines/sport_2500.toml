# The Sport 2.5 t tractor's driveline: a farm gearbox geared up for the
# built engine. The tall pulling gears, 5th to 8th, are close (about
# 15 % apart): at 2600 rpm on the 0.78 m rear tires (tires/sport_rear.toml)
# the wheels turn at about 27 to 41 km/h, the tractor going slower on its
# wheelspin. Too tall a gear for the track bogs the engine, too low a gear
# spins out. 1st to 5th are about 40 % apart, so 3rd and 4th are the low
# gears for a wet start or a weak engine. A two-gear powershift step, as
# fully built (the garage sets it; the Sport classes still have
# one, Supersport and up do not).

[driveline]
final_drive_ratio = 22.0       # bevel gear and final reduction together
efficiency = 0.90              # all meshes, applied in the direction power flows
input_inertia_kg_m2 = 0.05     # clutch disc, input shaft, countershaft
output_inertia_kg_m2 = 2.0     # final drive and axle; wheels belong to the tires

[driveline.gearbox]
ratios = [5.0, 3.57, 2.55, 1.82, 1.30, 1.13, 0.98, 0.85]   # 1st to 8th, about 40 % apart up to 5th, 15 % above
reverse = 12.0                 # ~2.5 km/h at 2200 rpm, ~1 km/h at idle

# A powershift step: one or two gears down under load, the clutch in,
# when the engine is pulled down near the end of a pull; once a pull (see
# drivelines/farm_stock_light.toml).
[driveline.powershift]
load_downshift_gears = 2
shifts_per_pull = 1

[driveline.drag]                # churning and bearings, on the input shaft
constant_nm = 2.0
viscous_nm_per_1000_rpm = 1.05  # ~0.01 N·m per rad/s
