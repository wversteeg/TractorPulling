# The garage for the Sport 2.5 t class (docs/career.md): the class's own
# tractor (tractors/sport_2500.toml) built from a stock small farm tractor
# up to the class's limits. A new class is a new tractor: these parts have
# names of their own, so nothing carries over from the standard class's
# garage by name; only the money does. Each level sets the part's value
# outright; each cost is from the level below, the stages dearer as they go.
#
# - engine_torque: the engine's full-load torque as a share of the fully
#   built engine's (engines/sport_2500.toml, about 220 hp): from a stock
#   4 l farm engine's 90 hp, through the pump, injectors, a bigger turbo
#   behind the class's 55 mm inlet, the manifold, head and cam.
# - rear_traction: the rear tires' traction limit, from worn farm tires to
#   cut 24.5" puller tires (cut tires allowed from Sport on); the tire's
#   size stays as tires/sport_rear.toml has it.
# - ballast_kg: weights up to the class's 2500 kg with the driver.
# - hitch_height_m: the drawbar, up to the class's 0.5 m.
# - rated_rpm: the governor, its unloaded speed 200 rpm above it, up to the
#   class's 2700 rpm.
# No powershift: the Sport classes pull in one gear on wheelspin.
#
# The two levels of the class (promo, top; seasons/sport_2500_*.toml)
# share this garage.

[garage]
start_money_eur = 1000

[[garage.upgrades]]
part = "engine_torque"
name = "Engine build"
levels = [
    { value = 0.41, cost_eur = 0, label = "Stock 4 l, 90 hp" },
    { value = 0.48, cost_eur = 800, label = "Pump turned up" },
    { value = 0.55, cost_eur = 1100, label = "Bigger injectors" },
    { value = 0.62, cost_eur = 1350, label = "Bigger turbo" },
    { value = 0.70, cost_eur = 1650, label = "Pulling manifold" },
    { value = 0.78, cost_eur = 1950, label = "Ported head" },
    { value = 0.86, cost_eur = 2250, label = "Pulling cam" },
    { value = 0.93, cost_eur = 2550, label = "Pump on maximum" },
    { value = 1.0, cost_eur = 2850, label = "Fully built, 220 hp" },
]

[[garage.upgrades]]
part = "rear_traction"
name = "Puller tires"
levels = [
    { value = 0.86, cost_eur = 0, label = "Worn farm tires" },
    { value = 0.88, cost_eur = 700, label = "Farm tires, good tread" },
    { value = 0.90, cost_eur = 950, label = "New farm tires" },
    { value = 0.92, cost_eur = 1200, label = "Wide farm tires" },
    { value = 0.94, cost_eur = 1450, label = "Puller tires" },
    { value = 0.95, cost_eur = 1700, label = "Puller tires, cut" },
    { value = 0.96, cost_eur = 1950, label = "Wide puller tires, cut" },
    { value = 0.97, cost_eur = 2200, label = "24.5\" puller tires, hand cut" },
]

[[garage.upgrades]]
part = "ballast_kg"
name = "Ballast weights"
levels = [
    { value = 0.0, cost_eur = 0, label = "No weights" },
    { value = 50.0, cost_eur = 700, label = "50 kg of weights" },
    { value = 100.0, cost_eur = 950, label = "100 kg of weights" },
    { value = 150.0, cost_eur = 1200, label = "150 kg of weights" },
    { value = 200.0, cost_eur = 1450, label = "200 kg of weights" },
    { value = 250.0, cost_eur = 1700, label = "250 kg of weights" },
    { value = 300.0, cost_eur = 1950, label = "300 kg, the class's 2500 kg" },
]

[[garage.upgrades]]
part = "hitch_height_m"
name = "Pulling hitch"
levels = [
    { value = 0.40, cost_eur = 0, label = "Farm drawbar, 0.40 m" },
    { value = 0.41, cost_eur = 700, label = "Drawbar raised, 0.41 m" },
    { value = 0.42, cost_eur = 950, label = "Drawbar raised, 0.42 m" },
    { value = 0.43, cost_eur = 1200, label = "Drawbar raised, 0.43 m" },
    { value = 0.45, cost_eur = 1450, label = "Pulling hitch, 0.45 m" },
    { value = 0.47, cost_eur = 1700, label = "Pulling hitch, 0.47 m" },
    { value = 0.50, cost_eur = 1950, label = "Pulling hitch, 0.50 m" },
]

[[garage.upgrades]]
part = "rated_rpm"
name = "Rev limit"
levels = [
    { value = 2200.0, cost_eur = 0, label = "Stock, 2200 rpm" },
    { value = 2275.0, cost_eur = 1000, label = "Turned up, 2275 rpm" },
    { value = 2350.0, cost_eur = 1400, label = "Turned up, 2350 rpm" },
    { value = 2425.0, cost_eur = 1900, label = "Turned up, 2425 rpm" },
    { value = 2500.0, cost_eur = 2400, label = "2500 rpm, 2700 unloaded" },
]
