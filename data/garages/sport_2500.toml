# The garage for the Sport 2.5 t class (docs/career.md): the class's own
# tractor (tractors/sport_2500.toml) built from a stock small farm tractor
# up to the class's limits. A new class is a new tractor: these parts have
# names of their own, so nothing carries over from the standard class's
# garage by name; only the money does. Each level sets the part's value
# outright; each cost is from the level below, the stages dearer as they go.
#
# - engine_torque: the engine's full-load torque as a share of the fully
#   built engine's (engines/sport_2500.toml, about 350 hp): from a stock
#   4 l farm engine's 145 hp, through the pump, injectors, a bigger turbo
#   behind the class's 55 mm inlet, the manifold, head and cam.
# - rear_traction: the rear tires' traction limit, from worn farm tires to
#   24.5" farm tires hand cut for pulling (the NTTO's Sport classes allow
#   cut tires, not puller tires: those come from Supersport on;
#   docs/career.md); the tire's size stays as tires/sport_rear.toml has
#   it.
# - ballast_kg: the free weight. The tractor is at the class's 2500 kg
#   with the driver, its weights bolted to the front bracket (the tractor
#   file's fixed_position); each level frees more of them to move before
#   a pull (back, for a slippery track), up to all of them.
# - hitch_height_m: the drawbar, up to the class's 0.5 m, a hole (2 cm)
#   at a time, so each level adds a hole to set it in below.
# - rated_rpm: the governor: full fuel up to this speed, cut off at the
#   class's 2700 rpm (the engine's high idle), the droop between them
#   shortening as it is turned up, so that under load the engine runs up
#   against the limit.
# - load_downshift_gears: a powershift step that shifts down under load,
#   one gear or two (the Sport classes still allow it; Supersport and up
#   do not).
#
# The two levels of the class (promo, top; seasons/sport_2500_*.toml)
# share this garage.

[garage]
start_money_eur = 1000

[[garage.upgrades]]
part = "engine_torque"
name = "Engine build"
levels = [
    { value = 0.41, cost_eur = 0, label = "Stock 4 l, 145 hp" },
    { value = 0.48, cost_eur = 800, label = "Pump turned up" },
    { value = 0.55, cost_eur = 1100, label = "Bigger injectors" },
    { value = 0.62, cost_eur = 1350, label = "Bigger turbo" },
    { value = 0.70, cost_eur = 1650, label = "Pulling manifold" },
    { value = 0.78, cost_eur = 1950, label = "Ported head" },
    { value = 0.86, cost_eur = 2250, label = "Pulling cam" },
    { value = 0.93, cost_eur = 2550, label = "Pump on maximum" },
    { value = 1.0, cost_eur = 2850, label = "Fully built, 350 hp" },
]

[[garage.upgrades]]
part = "rear_traction"
name = "Cut farm tires"
formerly = ["Puller tires"]   # a save from before keeps its level
levels = [
    { value = 1.29, cost_eur = 0, label = "Worn farm tires" },
    { value = 1.32, cost_eur = 700, label = "Farm tires, good tread" },
    { value = 1.35, cost_eur = 950, label = "New farm tires" },
    { value = 1.38, cost_eur = 1200, label = "Wide farm tires" },
    { value = 1.41, cost_eur = 1450, label = "Farm tires, cut" },
    { value = 1.425, cost_eur = 1700, label = "Farm tires, cut deeper" },
    { value = 1.44, cost_eur = 1950, label = "Wide farm tires, cut" },
    { value = 1.455, cost_eur = 2200, label = "24.5\" farm tires, hand cut" },
]

[[garage.upgrades]]
part = "ballast_kg"
name = "Free weight"
levels = [
    { value = 0.0, cost_eur = 0, label = "All weights fixed at the front" },
    { value = 50.0, cost_eur = 700, label = "50 kg free to move" },
    { value = 100.0, cost_eur = 950, label = "100 kg free to move" },
    { value = 150.0, cost_eur = 1200, label = "150 kg free to move" },
    { value = 200.0, cost_eur = 1450, label = "200 kg free to move" },
    { value = 250.0, cost_eur = 1700, label = "250 kg free to move" },
    { value = 300.0, cost_eur = 1950, label = "All 300 kg free to move" },
]

[[garage.upgrades]]
part = "hitch_height_m"
name = "Pulling hitch"
levels = [
    { value = 0.40, cost_eur = 0, label = "Farm drawbar, 0.40 m" },
    { value = 0.42, cost_eur = 700, label = "Drawbar raised, 0.42 m" },
    { value = 0.44, cost_eur = 950, label = "Drawbar raised, 0.44 m" },
    { value = 0.46, cost_eur = 1250, label = "Pulling hitch, 0.46 m" },
    { value = 0.48, cost_eur = 1550, label = "Pulling hitch, 0.48 m" },
    { value = 0.50, cost_eur = 1950, label = "Pulling hitch, 0.50 m" },
]

[[garage.upgrades]]
part = "rated_rpm"
name = "Rev limit"
levels = [
    { value = 2200.0, cost_eur = 0, label = "Stock, full fuel to 2200 rpm" },
    { value = 2310.0, cost_eur = 1000, label = "Turned up, 2310 rpm" },
    { value = 2420.0, cost_eur = 1400, label = "Turned up, 2420 rpm" },
    { value = 2530.0, cost_eur = 1900, label = "Turned up, 2530 rpm" },
    { value = 2650.0, cost_eur = 2400, label = "Pulling governor, 2650 rpm, cut at 2700" },
]

[[garage.upgrades]]
part = "load_downshift_gears"
name = "Sport powershift"
levels = [
    { value = 0.0, cost_eur = 0, label = "None: shift with the clutch" },
    { value = 1.0, cost_eur = 2400, label = "One gear down under load" },
    { value = 2.0, cost_eur = 1400, label = "Two gears down under load" },
]

# The dealer: a new class is a new tractor, bought when the class opens, as
# one of these models (the game draws each its own way; all pull alike).
# Priced at about a fifth of a winning season's prize money; the cheapest is
# never dearer than the money there is. Painting it later costs
# paint_cost_eur.
[garage.dealer]
paint_cost_eur = 500

[[garage.dealer.models]]
name = "Sprint Classic"
style = "pull_classic"
cost_eur = 4000
about = "The pulling tractor as it should be: a round bonnet, chrome and a roll bar."

[[garage.dealer.models]]
name = "Sprint Low"
style = "pull_low"
cost_eur = 4600
about = "Built low: a low bonnet, a short roll bar and one tall stack."

[[garage.dealer.models]]
name = "Sprint High"
style = "pull_high"
cost_eur = 5200
about = "A tall square bonnet, twin stacks and wide fenders."

[[garage.dealer.models]]
name = "Sprint Cage"
style = "pull_cage"
cost_eur = 5800
about = "A safety cage with a roof and lamps over a round bonnet."

[[garage.dealer.models]]
name = "Sprint Farm"
style = "pull_farm"
cost_eur = 6500
about = "A farm tractor's square hood on a pulling frame: the farmer's choice."

# The colours, the same at every dealer: the first comes with the tractor.
