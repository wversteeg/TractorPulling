# The career's garage for the NTTO standard class, 3.5 t: what a puller
# may improve on a stock farm tractor and stay in the class (NTTO
# technical rules, chapter 13; docs/career.md). The same parts as the club
# season's garage (ntto_standard_3500.toml), from the same first level to
# the same top, in finer stages: there is something to buy after nearly
# every event. Each level sets the part's value outright; each cost is
# from the level below. See ntto_standard_3500.toml for what each part
# does.
#
# The three levels of the class (belofte, promo, top; seasons/
# standard_3500_*.toml) share this garage: one tractor climbs them. The
# whole garage costs € 40,000, each part's stages dearer as they go (the
# last about three times the first), the powershift a fifth of it. With
# the levels' fields and prize money, a player who buys as they earn wins
# belofte in about three seasons (with about 45 % of the stages bought),
# promo in about two (75 %) and top once fully upgraded; the career asks
# at least two seasons on each level (careers/tractor_path.toml).

[garage]
start_money_eur = 1000

[[garage.upgrades]]
part = "engine_torque"
name = "Injection pump"
levels = [
    { value = 0.80, cost_eur = 0, label = "Worn pump and injectors" },
    { value = 0.84, cost_eur = 500, label = "Injectors cleaned" },
    { value = 0.87, cost_eur = 700, label = "New injectors" },
    { value = 0.90, cost_eur = 850, label = "Pump timing set" },
    { value = 0.92, cost_eur = 1050, label = "Pump overhauled" },
    { value = 0.95, cost_eur = 1250, label = "Pump calibrated" },
    { value = 0.98, cost_eur = 1400, label = "Turbo overhauled" },
    { value = 1.0, cost_eur = 1600, label = "Maker's figures, 84 hp" },
]

