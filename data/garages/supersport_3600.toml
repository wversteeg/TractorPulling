# The garage for the Supersport 3.6 t class (docs/career.md): the class's
# own tractor (tractors/supersport_3600.toml) built from a big stock
# six-cylinder farm tractor up to the class's limits. A new class is a new
# tractor: these parts have names of their own, so nothing carries over
# from the other classes' garages by name; only the money does. Each level
# sets the part's value outright; each cost is from the level below, the
# stages dearer as they go.
#
# The class's lesson is choosing: three garage choices, each alternative
# best somewhere, owned side by side once bought and fitted for nothing
# between events.
# - Engine: the stock tractor's 7.0 l six, cut at 2700 rpm (torque low
#   down: it pulls through a heavy track), or a 6.06 l six that may rev to
#   3200 rpm (engines/supersport_3600_*.toml): about the same power, higher
#   up, on a lighter crankshaft that spins the tires up. Each engine has
#   its own build and governor below; a stage bought for one stays when
#   the other is fitted.
# - Rear tires: the stock modified farm tires (big lugs, they grip at
#   little slip and smear spun fast; better on a soft, wet track) or puller
#   tires (many low bars that bite harder the faster they spin; better on
#   a firm track). Each tire has its own grip stages.
# - Final drive: the short one the farm tires want, or the tall one for
#   puller tires, which must spin fast to bite (drivelines/
#   supersport_3600_*.toml). Each final drive says which tires it suits
#   (`suits`), and the crew chief says so when it does not.
# No powershift: Supersport pulls in one gear.
#
# - engine_torque: the engine's full-load torque as a share of its fully
#   built curve (about 1000 hp either way): from a stock farm engine
#   through the pump, injectors, a bigger turbo, the intercooler, water
#   injection, the head and cam.
# - rated_rpm: the governor, full fuel up to it and cut off at the
#   engine's stop (7.0 l: 2700 rpm; 6.06 l: 3200 rpm), the droop shortening
#   as it is turned up.
# - rear_traction: the fitted tires' traction limit, from worn to hand cut.
# - ballast_kg: the free weight, up to the class's 3600 kg with the driver.
# - hitch_height_m: the pulling hitch's top hole, up to the class's 0.5 m.
#
# The three levels of the class (belofte, promo, top;
# seasons/supersport_3600_*.toml) share this garage.

[garage]
start_money_eur = 1500

[[garage.choices]]
slot = "engine"
name = "Engine"
alternatives = [
    { file = "../engines/supersport_3600_7l.toml", cost_eur = 0, label = "7.0 l six, 2700 rpm" },
    { file = "../engines/supersport_3600_6l.toml", cost_eur = 6000, label = "6.06 l six, 3200 rpm" },
]

[[garage.choices]]
slot = "rear_tire"
name = "Rear tires"
alternatives = [
    { file = "../tires/supersport_farm_rear.toml", cost_eur = 0, label = "Modified farm tires" },
    { file = "../tires/supersport_puller_rear.toml", cost_eur = 5000, label = "Puller tires" },
]

[[garage.choices]]
slot = "driveline"
name = "Final drive"
alternatives = [
    { file = "../drivelines/supersport_3600_short.toml", cost_eur = 0, label = "Short final drive", suits = { "Rear tires" = "Modified farm tires" } },
    { file = "../drivelines/supersport_3600_tall.toml", cost_eur = 3000, label = "Tall final drive", suits = { "Rear tires" = "Puller tires" } },
]

