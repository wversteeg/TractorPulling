# The dealer: a new class is a new tractor, bought when the class opens, as
# one of these models (the game draws each its own way; all pull alike).
# Priced at about a quarter of a winning season's prize money; the cheapest
# is never dearer than the money there is. Painting it later costs
# paint_cost_eur.
[garage.dealer]
paint_cost_eur = 900

# Farm tractors rebuilt for pulling, as the class's are: each keeps its
# maker's hood and grille (the rules keep the farm tractor's look), no cab
# but a full roll cage round the seat (the class asks one) and one big stack off its
# single turbo (one turbo, one stage), a weight rack or a big weight box
# ahead of the grille.
[[garage.dealer.models]]
name = "Thunder Eighties"
style = "ss_square"
cost_eur = 8500
about = "An eighties tractor's square hood, a black roll cage, one big stack and a weight rack."

[[garage.dealer.models]]
name = "Thunder Oldtimer"
style = "ss_round"
cost_eur = 9400
about = "An older tractor's round hood in a chrome roll cage, a tall chrome stack and a weight box."

[[garage.dealer.models]]
name = "Thunder Low"
style = "ss_low"
cost_eur = 10300
about = "Built low: a low square hood, a low black cage, one big stack and a weight rack."

[[garage.dealer.models]]
name = "Thunder Modern"
style = "ss_sloped"
cost_eur = 11200
about = "A modern tractor's sloping hood and lamp strips, a cage in its colour and a weight box."

[[garage.dealer.models]]
name = "Thunder High"
style = "ss_high"
cost_eur = 12300
about = "A tall square hood in a tall chrome roll cage, wide fenders and a weight box."

