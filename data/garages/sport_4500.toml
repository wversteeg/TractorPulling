# The garage for the Sport 4.5 t class (docs/career.md): the class's own
# tractor (tractors/sport_4500.toml) built from a big stock six-cylinder
# farm tractor up to the class's limits. A new class is a new tractor:
# these parts have names of their own, so nothing carries over from the
# other classes' garages by name; only the money does. Each level sets the
# part's value outright; each cost is from the level below, the stages
# dearer as they go. A full class, so more stages than Sport 2.5 t's.
#
# - Turbo (a garage choice): the stock tractor comes with a small, quick
#   turbo (engines/sport_4500_fast_turbo.toml, about 660 hp fully built),
#   full boost from 1300 rpm; the 68 mm turbo (engines/sport_4500.toml,
#   about 780 hp) is the upgrade, further on every track. Bought, either is
#   fitted for nothing between events. The class's setup lesson is the
#   weights, tire pressure and hitch for the track (docs/career.md).
# - engine_torque: the engine's full-load torque as a share of the fully
#   built engine's, whichever turbo is on: from a stock 7 l farm engine
#   (about 230 hp on the small turbo, 270 hp on the 68 mm one), through the
#   pump, injectors, lift pump, the intercooler, the injection timing, the
#   manifold, head and cam. The labels name no power: it depends on the
#   turbo fitted.
# - rear_traction: the rear tires' traction limit, from worn farm tires to
#   cut 30.5" puller tires.
# - ballast_kg: weights up to the class's 4500 kg with the driver.
# - hitch_height_m: the pulling hitch's top hole, up to the class's 0.5 m;
#   the puller sets it before each pull from its lowest hole, 0.40 m
#   (tractors/sport_4500.toml), up to the top one.
# - rated_rpm: the governor, its unloaded speed 200 rpm above it, up to the
#   class's 2700 rpm.
# - load_downshift_gears: a powershift step that shifts down under load,
#   one gear or two (the Sport classes still allow it; Supersport and up
#   do not).
#
# The three levels of the class (belofte, promo, top;
# seasons/sport_4500_*.toml) share this garage.

[garage]
start_money_eur = 1000

[[garage.choices]]
slot = "engine"
name = "Turbo"
alternatives = [
    { file = "../engines/sport_4500_fast_turbo.toml", cost_eur = 0, label = "Small, quick turbo" },
    { file = "../engines/sport_4500.toml", cost_eur = 4000, label = "68 mm turbo" },
]

[[garage.upgrades]]
part = "engine_torque"
name = "Six-cylinder build"
levels = [
    { value = 0.35, cost_eur = 0, label = "Stock 7 l" },
    { value = 0.41, cost_eur = 1100, label = "Pump turned up" },
    { value = 0.47, cost_eur = 1400, label = "Bigger injectors" },
    { value = 0.53, cost_eur = 1700, label = "Bigger lift pump" },
    { value = 0.60, cost_eur = 2000, label = "Intercooler" },
    { value = 0.67, cost_eur = 2300, label = "Injection timing" },
    { value = 0.74, cost_eur = 2600, label = "Pulling manifold" },
    { value = 0.81, cost_eur = 2900, label = "Ported head" },
    { value = 0.88, cost_eur = 3200, label = "Pulling cam" },
    { value = 0.94, cost_eur = 3500, label = "Pump on maximum" },
    { value = 1.0, cost_eur = 3800, label = "Fully built" },
]

[[garage.upgrades]]
part = "rear_traction"
name = "30.5\" puller tires"
levels = [
    { value = 1.29, cost_eur = 0, label = "Worn farm tires" },
    { value = 1.312, cost_eur = 900, label = "Farm tires, good tread" },
    { value = 1.335, cost_eur = 1200, label = "New farm tires" },
    { value = 1.358, cost_eur = 1500, label = "Wide farm tires" },
    { value = 1.38, cost_eur = 1800, label = "Puller tires" },
    { value = 1.403, cost_eur = 2100, label = "Puller tires, cut" },
    { value = 1.417, cost_eur = 2400, label = "Wide puller tires, cut" },
    { value = 1.432, cost_eur = 2700, label = "30.5\" puller tires, cut" },
    { value = 1.462, cost_eur = 3000, label = "30.5\" puller tires, hand cut" },
]

[[garage.upgrades]]
part = "ballast_kg"
name = "Weights and front bracket"
levels = [
    { value = 0.0, cost_eur = 0, label = "No weights" },
    { value = 80.0, cost_eur = 900, label = "80 kg of weights" },
    { value = 160.0, cost_eur = 1200, label = "160 kg of weights" },
    { value = 240.0, cost_eur = 1500, label = "240 kg of weights" },
    { value = 320.0, cost_eur = 1800, label = "320 kg of weights" },
    { value = 400.0, cost_eur = 2100, label = "400 kg of weights" },
    { value = 500.0, cost_eur = 2400, label = "500 kg, the class's 4500 kg" },
]

[[garage.upgrades]]
part = "hitch_height_m"
name = "Pulling drawbar"
levels = [
    { value = 0.40, cost_eur = 0, label = "Farm drawbar, 0.40 m" },
    { value = 0.42, cost_eur = 900, label = "Drawbar raised, 0.42 m" },
    { value = 0.44, cost_eur = 1200, label = "Drawbar raised, 0.44 m" },
    { value = 0.46, cost_eur = 1500, label = "Pulling hitch, 0.46 m" },
    { value = 0.48, cost_eur = 1800, label = "Pulling hitch, 0.48 m" },
    { value = 0.50, cost_eur = 2100, label = "Pulling hitch, 0.50 m" },
]

[[garage.upgrades]]
part = "rated_rpm"
name = "Governor"
levels = [
    { value = 2200.0, cost_eur = 0, label = "Stock, 2200 rpm" },
    { value = 2250.0, cost_eur = 1000, label = "Turned up, 2250 rpm" },
    { value = 2300.0, cost_eur = 1300, label = "Turned up, 2300 rpm" },
    { value = 2350.0, cost_eur = 1600, label = "Turned up, 2350 rpm" },
    { value = 2400.0, cost_eur = 1900, label = "Turned up, 2400 rpm" },
    { value = 2450.0, cost_eur = 2200, label = "Turned up, 2450 rpm" },
    { value = 2500.0, cost_eur = 2500, label = "2500 rpm, 2700 unloaded" },
]

[[garage.upgrades]]
part = "load_downshift_gears"
name = "Sport powershift"
levels = [
    { value = 0.0, cost_eur = 0, label = "None: shift with the clutch" },
    { value = 1.0, cost_eur = 3200, label = "One gear down under load" },
    { value = 2.0, cost_eur = 1800, label = "Two gears down under load" },
]
