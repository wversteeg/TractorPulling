.0,2.0;" x1="141.0103" x2="481.6538" y1="353.7148" y2="353.7148"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="153.0103" y="348.5791">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.3623" x="165.4526" y="348.5791">rear / front / bar loads, front lifted</text><path d="M5,366.7148 L5,407.7148 L268,407.7148 L268,376.7148 L258,366.7148 L5,366.7148 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M258,366.7148 L258,376.7148 L268,376.7148 L258,366.7148 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.5649" x="11" y="384.3086">rear load sets traction; front and bar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.5884" x="11" y="400.0381">loads set their rolling drag (chain solve)</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1.0;" width="1170.1699" x="0" y="434.0386"/><line style="stroke:#000000;stroke-width:1.0;" x1="0" x2="1170.1699" y1="434.0386" y2="434.0386"/><line style="stroke:#000000;stroke-width:1.0;" x1="0" x2="1170.1699" y1="437.0386" y2="437.0386"/><rect fill="#EEEEEE" height="23.7295" style="stroke:#000000;stroke-width:2.0;" width="343.4307" x="413.3696" y="423.1738"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="326.3521" x="419.3696" y="439.7676">end of the step, after the chain solve and advance()</text><line style="stroke:#181818;stroke-width:1.0;" x1="136.0103" x2="178.0103" y1="494.3623" y2="494.3623"/><line style="stroke:#181818;stroke-width:1.0;" x1="178.0103" x2="178.0103" y1="494.3623" y2="507.3623"/><line style="stroke:#181818;stroke-width:1.0;" x1="137.0103" x2="178.0103" y1="507.3623" y2="507.3623"/><polygon fill="#181818" points="