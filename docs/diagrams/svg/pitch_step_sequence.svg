arries the weight</text><polygon fill="#181818" points="470.6538,146.3379,480.6538,150.3379,470.6538,154.3379,474.6538,150.3379" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="136.0103" x2="476.6538" y1="150.3379" y2="150.3379"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="5.605" x="143.0103" y="145.2021">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.9521" x="152.6152" y="145.2021">axle_loads(params, state)</text><polygon fill="#181818" points="1101.0356,176.0674,1111.0356,180.0674,1101.0356,184.0674,1105.0356,180.0674" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="482.6538" x2="1107.0356" y1="180.0674" y2="180.0674"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.1885" x="489.6538" y="174.9316">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.6616" x="501.8423" y="174.9316">sin_cos(pitch)</text><line style="stroke:#181818;stroke-width:1.0;" x1="482.6538" x2="524.6538" y1="209.7969" y2="209.7969"/><line style="stroke:#181818;stroke-width:1.0;" x1="524.6538" x2="524.6538" y1="209.7969" y2="222.7969"/><line style="stroke:#181818;stroke-width:1.0;" x1="483.6538" x2="524.6538" y1="222.7969" y2="222.7969"/><polygon fill="#181818" points="493.6538,218.7969,483.6538,222.7969,493.6538,226.7969,489.6538,222.7969" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3916" x="489.6538" y="204.6611">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.2451" x="502.0454" y="204.6611">front tires: k &#948; + c &#948;' (&#948; from preload - L sin &#952;), &#8805; 0</text><lin