 font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.5991" x="533.0029" y="245.3301">fuel = clamp((target - omega) / droop, 0, 1)</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="445.4043" x2="938.7261" y1="259.4658" y2="259.4658"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="44.3169" x="450.4043" y="270.1221">[stalled]</text><line style="stroke:#181818;stroke-width:1.0;" x1="503.2114" x2="545.2114" y1="295.5049" y2="295.5049"/><line style="stroke:#181818;stroke-width:1.0;" x1="545.2114" x2="545.2114" y1="295.5049" y2="308.5049"/><line style="stroke:#181818;stroke-width:1.0;" x1="504.2114" x2="545.2114" y1="308.5049" y2="308.5049"/><polygon fill="#181818" points="514.2114,304.5049,504.2114,308.5049,514.2114,312.5049,510.2114,308.5049" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3091" x="510.2114" y="290.3691">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="47.3408" x="522.5205" y="290.3691">fuel = 0</text><polygon fill="#181818" points="986.1748,341.2344,996.1748,345.2344,986.1748,349.2344,990.1748,345.2344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="503.2114" x2="992.1748" y1="345.2344" y2="345.2344"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="510.2114" y="340.0986">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.6221" x="522.6538" y="340.0986">(params, omega)</text><polygon fill="#181818" points="514.2114,370.9639,504.2114,374.9639,514.2114,378.9639,510.2114,374.9639" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="508.2114" x2="997.1748" y1="374.9639" y2="374.9639"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.5601" x="520.2114" y="369.8281">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.2539" x="531.7715" y="369.8281">0..1, rising from boost onset to full boost</text><line style="stroke:#181818;stroke-width:1.0;" x1="503.2114" x2="545.2114" y1="420.4229" y2="420.4229"/><line style="stroke:#181818;stroke-width:1.0;" x1="545.2114" x2="545.2114" y1="420.4229" y2="433.4229"/><line style="stroke:#181818;stroke-width:1.0;" x1="504.2114" x2="545.2114" y1="433.4229" y2="433.4229"/><polygon fill="#181818" points="514.2114,429.4229,504.2114,433.4229,514.2114,437.4229,510.2114,433.4229" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4614" x="510.2114" y="407.4224">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.0195" x="522.6729" y="399.5576">boost += (fuel * exhaust - boost) * dt / (tau + dt)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.834" x="522.6729" y="415.2871">(implicit lag, no exp())</text><polygon fill="#181818" points="1157.1543,459.1523,1167.1543,463.1523,1157.1543,467.1523,1161.1543,463.1523" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="503.2114" x2="1163.1543" y1="463.1523" y2="463.1523"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="510.2114" y="458.0166">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.6699" x="522.6538" y="458.0166">evaluate(omega)</text><polygon fill="#181818" points="514.2114,488.8818,504.2114,492.8818,514.2114,496.8818,510.2114,492.8818" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="508.2114" x2="1168.1543" y1="492.8818" y2="492.8818"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.3711" x="520.2114" y="487.7461">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.8691" x="538.5825" y="487.7461">full-load torque [N&#183;m]</text><line style="stroke:#181818;stroke-width:1.0;" x1="503.2114" x2="545.2114" y1="522.6113" y2="522.6113"/><line style="stroke:#181818;stroke-width:1.0;" x1="545.2114" x2="545.2114" y1="522.6113" y2="535.6113"/><line style="stroke:#181818;stroke-width:1.0;" x1="504.2114" x2="545.2114" y1="535.6113" y2="535.6113"/><polygon fill="#181818" points="514.2114,531.6113,504.2114,535.6113,514.2114,539.6113,510.2114,535.6113" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="11.21" x="510.2114" y="517.4756">11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.623" x="525.4214" y="517.4756">combustion = fuel * full_load * (na + (1 - na) * boost)</text><line style="stroke:#181818;stroke-width:1.0;" x1="503.2114" x2="545.2114" y1="596.7998" y2="596.7998"/><line style="stroke:#181818;stroke-width:1.0;" x1="545.2114" x2="545.2114" y1="596.7998" y2="609.7998"/><line style="stroke:#181818;stroke-width:1.0;" x1="504.2114" x2="545.2114" y1="609.7998" y2="609.7998"/><polygon fill="#181818" points="514.2114,605.7998,504.2114,609.7998,514.2114,613.7998,510.2114,609.7998" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.7935" x="510.2114" y="575.9346">12</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.9136" x="528.0049" y="560.2051">omega' = (omega + dt/I * (combustion - friction - load))</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.3262" x="560.9111" y="575.9346">/ (1 + dt/I * viscous)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.8398" x="528.0049" y="591.6641">(semi-implicit Euler)</text><line style="stroke:#181818;stroke-width:1.0;" x1="503.2114" x2="545.2114" y1="639.5293" y2="639.5293"/><line style="stroke:#181818;stroke-width:1.0;" x1="545.2114" x2="545.2114" y1="639.5293" y2="652.5293"/><line style="stroke:#181818;stroke-width:1.0;" x1="504.2114" x2="545.2114" y1="652.5293" y2="652.5293"/><polygon fill="#181818" points="514.2114,648.5293,504.2114,652.5293,514.2114,656.5293,510.2114,652.5293" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.9966" x="510.2114" y="634.3936">13</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.7495" x="528.208" y="634.3936">omega = max(omega', 0)</text><path d="M445.4043,667.5293 L511.3325,667.5293 L511.3325,675.2588 L501.3325,685.2588 L445.4043,685.2588 L445.4043,667.5293 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="60.459" style="stroke:#000000;stroke-width:1.5;" width="269.0288" x="445.4043" y="667.5293"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.9282" x="460.4043" y="681.123">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="183.1006" x="526.3325" y="680.1855">[running and omega &lt; stall speed]</text><line style="stroke:#181818;stroke-width:1.0;" x1="503.2114" x2="545.2114" y1="706.9883" y2