text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.1709" x="294.7412" y="63.502">turn::step</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="77.1709" x="287.7412" y="915.6641"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.1709" x="294.7412" y="936.2266">turn::step</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="74.4023" x="928.5293" y="42.9395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.4023" x="935.5293" y="63.502">pull::step</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="74.4023" x="928.5293" y="915.6641"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.4023" x="935.5293" y="936.2266">pull::step</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="72.5908" x="1012.9316" y="42.9395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.5908" x="1019.9316" y="63.502">run::step</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="72.5908" x="1012.9316" y="915.6641"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.5908" x="1019.9316" y="936.2266">run::step</text><polygon fill="#181818" points="314.3267,102.6084,324.3267,106.6084,314.3267,110.6084,318.3267,106.6084" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="37.9902" x2="320.3267" y1="106.6084" y2="106.6084"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="5.605" x="44.9902" y="101.4727">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.7314" x="54.5952" y="101.4727">step(turn, model, rules, parking, input, dt)</text><path d="M267.7412,121.6084 L328.5723,121.6084 L328.5723,129.3379 L318.5723,139.3379 L267.7412,139.3379 L267.7412,121.6084 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="748.3262" style="stroke:#000000;stroke-width:1.5;" width="1065.6411" x="267.7412" y="121.6084"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="282.7412" y="135.2021">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="84.0737" x="343.5723" y="134.2646">[stage kPulling]</text><polygon fill="#181818" points="1037.2271,157.0674,1047.2271,161.0674,1037.2271,165.0674,1041.2271,161.0674" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="326.3267" x2="1043.2271" y1="161.0674" y2="161.0674"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.1885" x="333.3267" y="155.9316">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.7603" x="345.5151" y="155.9316">step(run, model, rules, input with pull_on)</text><polygon fill="#181818" points="337.3267,186.7969,327.3267,190.7969,337.3267,194.7969,333.3267,190.7969" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="331.3267" x2="1048.2271" y1="190.7969" y2="190.7969"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3916" x="343.3267" y="185.6611">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.9976" x="355.7183" y="185.6611">the pull's output; its result once the sled stops</text><line style="stroke:#181818;stroke-width:1.0;" x1="326.3267" x2="368.3267" y1="236.2559" y2="236.2559"/><line style="stroke:#181818;stroke-width:1.0;" x1="368.3267" x2="368.3267" y1="236.2559" y2="249.2559"/><line style="stroke:#181818;stroke-width:1.0;" x1="327.3267" x2="368.3267" y1="249.2559" y2="249.2559"/><polygon fill="#181818" points="337.3267,245.2559,327.3267,249.2559,337.3267,253.2559,333.3267,249.2559" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.7915" x="333.3267" y="223.2554">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.8604" x="346.1182" y="215.3906">result in: the sled held, stage kReleasing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.4258" x="346.1182" y="231.1201">(at the line: kParked, and nothing moves after)</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="267.7412" x2="1333.3823" y1="258.2559" y2="258.2559"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="92.0928" x="272.7412" y="268.9121">[any other stage]</text><line style="stroke:#181818;stroke-width:1.0;" x1="326.3267" x2="368.3267" y1="310.0244" y2="310.0244"/><line style="stroke:#181818;stroke-width:1.0;" x1="368.3267" x2="368.3267" y1="310.0244" y2="323.0244"/><line style="stroke:#181818;stroke-width:1.0;" x1="327.3267" x2="368.3267" y1="323.0244" y2="323.0244"/><polygon fill="#181818" points="337.3267,319.0244,327.3267,323.0244,337.3267,327.0244,333.3267,323.0244" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3091" x="333.3267" y="297.0239">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.4126" x="345.6357" y="289.1592">pull_on off (any gear); a stalled engine starts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.3457" x="345.6357" y="304.8887">again once the clutch is pressed; parked: idle in neutral</text><polygon fill="#181818" points="953.7305,348.7539,963.7305,352.7539,953.7305,356.7539,957.7305,352.7539" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="326.3267" x2="959.7305" y1="352.7539" y2="352.7539"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="333.3267" y="347.6182">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.4829" x="345.769" y="347.6182">step(pull, model, input)</text><path d="M970,365.7539 L970,422.7539 L1323,422.7539 L1323,375.7539 L1313,365.7539 L970,365.7539 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1313,365.7539 L1313,375.7539 L1323,375.7539 L1313,365.7539 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.876" x="976" y="383.3477">unhooked, the chain pulls neither end;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.2129" x="976" y="399.0771">held, the sled stands still;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.3823" x="976" y="414.8066">driving back, it goes to the start line (sled::drive_back)</text><polygon fill="#181818" points="337.3267,445.6719,327.3267,449.6719,337.3267,453.6719,333.3267,449.6719" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="331.3267" x2="964.7305" y1="449.6719" y2="449.6719"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.5601" x="343.3267" y="444.5361">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.6719" x="354.8867" y="444.5361">output (chain tension)</text><path d="M277.7412,464.6719 L338.5723,464.6719 L338.5723,472.4014 L328.5723,482.4014 L277.7412,482.4014 L277.7412,464.6719 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="398.2627" style="stroke:#000000;stroke-width:1.5;" width="692.9893" x="277.7412" y="464.6719"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="292.7412" y="478.2656">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="73.1758" x="353.5723" y="477.3281">[kToTheSled]</text><line style="stroke:#181818;stroke-width:1.0;" x1="326.3267" x2="368.3267" y1="519.8604" y2="519.8604"/><line style="stroke:#181818;stroke-width:1.0;" x1="368.3267" x2="368.3267" y1="519.8604" y2="532.8604"/><line style="stroke:#181818;stroke-width:1.0;" x1="327.3267" x2="368.3267" y1="532.8604" y2="532.8604"/><polygon fill="#181818" points="337.3267,528.8604,327.3267,532.8604,337.3267,536.8604,333.3267,532.8604" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4614" x="333.3267" y="506.8599">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.9116" x="345.7881" y="498.9951">hooks_on (standing, the hitch ahead of the hook within</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.6045" x="345.7881" y="514.7246">the chain's length, near the sled's line): hooked, kTakingUpSlack</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="277.7412" x2="970.7305" y1="541.8604" y2="541.8604"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="95.9707" x="282.7412" y="552.5166">[kTakingUpSlack]</text><line style="stroke:#181818;stroke-width:1.0;" x1="326.3267" x2="368.3267" y1="577.8994" y2="577.8994"/><line style="stroke:#181818;stroke-width:1.0;" x1="368.3267" x2="368.3267" y1="577.8994" y2="590.8994"/><line style="stroke:#181818;stroke-width:1.0;" x1="327.3267" x2="368.3267" y1="590.8994" y2="590.8994"/><polygon fill="#181818" points="337.3267,586.8994,327.3267,590.8994,337.3267,594.8994,333.3267,590.8994" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="333.3267" y="572.7637">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.3726" x="345.769" y="572.7637">tension &gt;= 1 kN: the slack is taken up, kWaitingForTheFlag</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="277.7412" x2="970.7305" y1="599.8994" y2="599.8994"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="117.4604" x="282.7412" y="610.5557">[kWaitingForTheFlag]</text><line style="stroke:#181818;stroke-width:1.0;" x1="326.3267" x2="368.3267" y1="635.9385" y2="635.9385"/><line style="stroke:#181818;stroke-width:1.0;" x1="368.3267" x2="368.3267" y1="635.9385" y2="648.9385"/><line style="stroke:#181818;stroke-width:1.0;" x1="327.3267" x2="368.3267" y1="648.9385" y2="648.9385"/><polygon fill="#181818" points="337.3267,644.9385,327.3267,648.9385,337.3267,652.9385,333.3267,648.9385" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.3711" x="333.3267" y="630.8027">10</text><text fill="#000000" font-family="