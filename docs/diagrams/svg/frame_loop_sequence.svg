ate(Setup)</text><polygon fill="#181818" points="190.876,200.7363,180.876,204.7363,190.876,208.7363,186.876,204.7363" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="184.876" x2="434.7734" y1="204.7363" y2="204.7363"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.1885" x="196.876" y="199.6006">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.5498" x="209.0645" y="199.6006">optional&lt;Session&gt;</text><path d="M72,219.7363 L144.6631,219.7363 L144.6631,227.4658 L134.6631,237.4658 L72,237.4658 L72,219.7363 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="548.5898" style="stroke:#000000;stroke-width:1.5;" width="914.8838" x="72" y="219.7363"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="27.6631" x="87" y="233.3301">loop</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="125.4741" x="159.6631" y="232.3926">[every rendered frame]</text><polygon fill="#181818" points="423.7734,255.1953,433.7734,259.1953,423.7734,263.1953,427.7734,259.1953" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="179.876" x2="429.7734" y1="259.1953" y2="259.1953"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3916" x="186.876" y="254.0596">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.2202" x="199.2676" y="254.0596">advance(Controls, elapsed_ns)</text><polygon fill="#181818" points="661.0874,284.9248,671.0874,288.9248,661.0874,292.9248,665.0874,288.9248" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="435.7734" x2="667.0874" y1="288.9248" y2="288.9248"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.7915" x="442.7734" y="283.7891">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.895" x="455.5649" y="283.7891">advance(elapsed_ns)</text><polygon fill="#181818" points="446.7734,330.3838,436.7734,334.3838,446.7734,338.3838,442.7734,334.3838" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="440.7734" x2="672.0874" y1="334.3838" y2="334.3838"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3091" x="452.7734" y="321.3833">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.457" x="465.0825" y="313.5186">Advance {steps, dropped_ns}</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.0049" x="465.0825" y="329.248">(steps &lt;= max_steps_per_frame)</text><path d="M363.5562,349.3838 L436.2192,349.3838 L436.2192,357.1133 L426.2192,367.1133 L363.5562,367.1133 L363.5562,349.3838 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="219.5654" style="stroke:#000000;stroke-width:1.5;" width="613.3276" x="363.5562" y="349.3838"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="27.6631" x="378.5562" y="362.9775">loop</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="210.5415" x="451.2192" y="362.04">[steps times (until the run has a result)]</text><polygon fill="#181818" points="801.1958,416.3018,811.1958,420.3018,801.1958,424.3018,805.1958,420.3018" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="435.7734" x2