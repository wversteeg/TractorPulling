0000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="343.4546" x="401.7129" y="342.3105">[lifted off, neutral in, or another gear asked for (not a load shift)]</text><line style="stroke:#181818;stroke-width:1.0;" x1="389.4004" x2="431.4004" y1="369.1133" y2="369.1133"/><line style="stroke:#181818;stroke-width:1.0;" x1="431.4004" x2="431.4004" y1="369.1133" y2="382.1133"/><line style="stroke:#181818;stroke-width:1.0;" x1="390.4004" x2="431.4004" y1="382.1133" y2="382.1133"/><polygon fill="#181818" points="400.4004,378.1133,390.4004,382.1133,400.4004,386.1133,396.4004,382.1133" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3091" x="396.4004" y="363.9775">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.3257" x="408.7095" y="363.9775">engagement -= dt / release_time</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="325.8818" x2="750.1675" y1="391.1133" y2="391.1133"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="197.6724" x="330.8818" y="401.7695">[engine at or above the guard speed]</text><line style="stroke:#181818;stroke-width:1.0;" x1="389.4004" x2="431.4004" y1="427.1523" y2="427.1523"/><line style="stroke:#181818;stroke-width:1.0;" x1="431.4004" x2="431.4004" y1="427.1523" y2="440.1523"/><line style="stroke:#181818;stroke-width:1.0;" x1="390.4004" x2="431.4004" y1="440.1523" y2="440.1523"/><polygon fill="#181818" points="400.4004,436.1523,390.4004,440.1523,400.4004,444.1523,396.4004,440.1523" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="396.4004" y="422.0166">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.0898" x="408.8428" y="422.0166">engagement += dt / engage_time</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="325.8818" x2="750.1675" y1="449.1523" y2="449.1523"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="170.1724" x="330.8818" y="459.8086">[engine below the guard speed]</text><line style="stroke:#181818;stroke-width:1.0;" x1="389.4004" x2="431.4004" y1="500.9209" y2="500.9209"/><line style="stroke:#181818;stroke-width:1.0;" x1="431.4004" x2="431.4004" y1="500.9209" y2="513.9209"/><line style="stroke:#181818;stroke-width:1.0;" x1="390.4004" x2="431.4004" y1="513.9209" y2="513.9209"/><polygon fill="#181818" points="400.4004,509.9209,390.4004,513.9209,400.4004,517.9209,396.4004,513.9209" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.5601" x="396.4004" y="487.9204">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.3257" x="407.9604" y="480.0557">engagement -= dt / release_time</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.6626" x="415.2729" y="495.7852">x min(1, (guard - omega) / band)</text><polygon fill="#181818" points="806.7031,546.6504,816.7031,550.6504,806.7031,554.6504,810.7031,550.6504" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="389.4004" x2="812.7031" y1="550.6504" y2="550.6504"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4614" x="396.4004" y="545.5146">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.8745" x="408.8618" y="545.5146">pedal_for(clutch, engagement)</text><polygon fill="#181818" points="400.4004,576.3799,390.4004,580.3799,400.4004,584.3799,396.4004,580.3799" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="394.4004" x2="817.7031" y1="580.3799" y2="580.3799"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="406.4004" y="575.2441">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.3169" x="418.8428" y="575.2441">pedal (the engagement curve read backwards)</text><line style="stroke:#181818;stroke-width:1.0;" x1="389.4004" x2="431.4004" y1="625.8389" y2="625.8389"/><line style="stroke:#181818;stroke-width:1.0;" x1="431.4004" x2="431.4004" y1="625.8389" y2="638.8389"/><line style="stroke:#181818;stroke-width:1.0;" x1="390.4004" x2="431.4004" y1="638.8389" y2="638.8389"/><polygon fill="#181818" points="400.4004,634.8389,390.4004,638.8389,400.4004,642.8389,396.4004,638.8389" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.3711" x="396.4004" y="612.8384">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.8345" x="414.7715" y="604.9736">steering: the control past the dead zone,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.4922" x="414.7715" y="620.7031">followed at up to steer_rate x dt</text><line style="stroke:#181818;stroke-width:1.0;" x1="389.4004" x2="431.4004" y1="684.2979" y2="684.2979"/><line style="stroke:#181818;stroke-width:1.0;" x1="431.4004" x2="431.4004" y1="684.2979" y2="697.2979"/><line style="stroke:#181818;stroke-width:1.0;" x1="390.4004" x2="431.4004" y1="697.2979" y2="697.2979"/><polygon fill="#181818" points="400.4004,693.2979,390.4004,697.2979,400.4004,701.2979,396.4004,697.2979" style="stroke:#181818;stroke-width:1.0;"/