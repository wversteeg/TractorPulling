004" y1="139.2773" y2="139.2773"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="5.605" x="82.0068" y="126.2769">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.7886" x="91.6118" y="118.4121">easy({throttle, gear, steering}, params, assist,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.0688" x="91.6118" y="134.1416">tractor, state.pull.tractor, dt)</text><line style="stroke:#181818;stroke-width:1.0;" x1="389.4004" x2="431.4004" y1="184.7363" y2="184.7363"/><line style="stroke:#181818;stroke-width:1.0;" x1="431.4004" x2="431.4004" y1="184.7363" y2="197.7363"/><line style="stroke:#181818;stroke-width:1.0;" x1="390.4004" x2="431.4004" y1="197.7363" y2="197.7363"/><polygon fill="#181818" points="400.4004,193.7363,390.4004,197.7363,400.4004,201.7363,396.4004,197.7363" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.1885" x="396.4004" y="171.7358">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.4155" x="408.5889" y="163.8711">guard = max(min(guard_share x rated,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.6729" x="415.9014" y="179.6006">engine::full_fuel_omega_rad_s(throttle)), stall + band)</text><line style="stroke:#181818;stroke-width:1.0;" x1="389.4004" x2="431.4004" y1="243.1953" y2="243.1953"/><line style="stroke:#181818;stroke-width:1.0;" x1="431.4004" x2="431.4004" y1="243.1953" y2="256.1953"/><line style="stroke:#181818;stroke-width:1.0;" x1="390.4004" x2="431.4004" y1="256.1953" y2="256.1953"/><polygon fill="#181818" points="400.4004,252.1953,390.4004,256.1953,400.4004,260.1953,396.4004,256.1953" style="stroke:#181818;stroke-width:1.0;"/><text fill=