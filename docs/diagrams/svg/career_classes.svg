 Q261.2144,94.0439 263.7144,94.0439 Q264.4175,94.0439 265.0581,94.2002 Q265.7144,94.3564 266.2769,94.6533 L266.2769,97.3721 Q265.6519,96.7939 265.0581,96.5283 Q264.4644,96.2471 263.8394,96.2471 Q262.4956,96.2471 261.8081,97.3252 Q261.1206,98.3877 261.1206,100.4814 Q261.1206,102.5752 261.8081,103.6533 Q262.4956,104.7158 263.8394,104.7158 Q264.4644,104.7158 265.0581,104.4502 Q265.6519,104.1689 266.2769,103.5908 L266.2769,106.3096 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="93.1875" x="291.4233" y="96.5645">&#171;free functions&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.418" x="283.8081" y="113.0215">career functions</text><line style="stroke:#181818;stroke-width:0.5;" x1="24.5" x2="619.0342" y1="121.3984" y2="121.3984"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.0986" x="29.5" y="138.9609">+kMaxRungs = 36</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.5205" x="29.5" y="155.9004">+kMaxMinSeasons = 10</text><line style="stroke:#181818;stroke-width:0.5;" x1="24.5" x2="619.0342" y1="163.2773" y2="163.2773"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="325.2129" x="29.5" y="180.8398">+validate(const Ladder&amp;) : optional&lt;ParamError&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="304.124" x="29.5" y="197.7793">+valid(const Progress&amp;, const Ladder&amp;) : bool</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="365.2441" x="29.5" y="214.7188">+starting_at(const Ladder&amp;, rung) : optional&lt;Progress&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="465.2266" x="29.5" y="231.6582">+finish_season(Progress&amp;, const Ladder&amp;, championship_place) : bool</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="584.5342" x="29.5" y="248.5977">+finish_season(Progress&amp;, const Ladder&amp;, span&lt;const season::Standing&gt;, player) : bool</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="263.4297" x="29.5" y="265.5371">+may_move_up(const Progress&amp;) : bool</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.4805" x="29.5" y="282.4766">+move_up(Progress&amp;) : bool</text></g><g id="elem_GMN13"><path d="M171,562.9395 L171,714.5049 A0,0 0 0 0 171,714.5049 L605.188,714.5049 A0,0 0 0 0 605.188,714.5049 L605.188,572.9395 L595.188,562.9395 L392,562.9395 L388,500.0395 L384,562.9395 L171,562.9395 A0,0 0 0 0 171,562.9395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M595.188,562.9395 L595.188,572.9395 L605.188,572.9395 L595.188,562.9395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.1021" x="177" y="580.5332">a rung is a class at one of its levels (belofte, promo, top).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.0586" x="177" y="596.2627">A season finished at promotion_place or better (1: the title)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="413.188" x="177" y="611.9922">opens the rung above once the rung has had min_seasons seasons</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.5093" x="177" y="627.7217">(a title in the first opens it after the last of them); the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.7964" x="177" y="643.4512">player is asked whether to move up.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.646" x="177" y="659.1807">A rung opened stays open: a player who stays to defend the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360.8389" x="177" y="674.9102">title may move up after a later season. starting_at() starts a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.1274" x="177" y="690.6396">career on any rung, for testing. Which rung is which (season,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.2573" x="177" y="706.3691">garage, rules) is the data's (data/careers/)</text></g><!--link CareerFns to Ladder--><g id="link_CareerFns_Ladder"><path codeLine="34" d="M279.4,290.1895 C265.09,325.1895 252.0796,357.0453 240.3396,385.7753 " fill="none" id="CareerFns-to-Ladder" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="238.07,391.3295,245.1772,384.5113,239.9613,386.701,237.7716,381.4851,238.07,391.3295" style="stroke:#181818;stroke-width:1.0;"/></g><!--link CareerFns to Progress--><g id="link_CareerFns_Progress"><path codeLine="35" d="M349.04,290.1895 C357.22,321.7595 364.4144,349.4814 371.5044,376.8314 " fill="none" id="CareerFns-to-Progress" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="373.01,382.6395,374.6236,372.9237,371.7553,377.7994,366.8795,374.9312,373.01,382.6395" style="stroke:#181818;stroke-width:1.0;"/></g><!--link CareerFns to SeasonStanding--><g id="link_CareerFns_SeasonStanding"><path codeLine="37" d="M497.01,290.0095 C584.1,341.7895 674.9427,395.8131 719.5127,422.3131 " fill="none" id="CareerFns-to-SeasonStanding" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="724.67,425.3795,718.9783,417.3417,720.3723,422.8242,714.8899,424.2181,724.67,425.3795" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.1924" x="607.2554" y="333.5332">the player's place</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.7031" x="600" y="349.2627">in the championship</text></g><!--link CareerFns to MaxPullers--><g id="link_CareerFns_MaxPullers"><path codeLine="38" d="M620.61,275.5695 C658.55,289.2795 696.5,304.1595 732,319.9395 C783.03,342.6195 792.88,354.1095 841,382.4395 C865.33,396.7595 887.7776,410.3451 907.1076,422.1351 " fill="none" id="CareerFns-to-MaxPullers" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="912.23,425.2595,906.6293,417.1581,907.9614,422.6559,902.4636,423.9879,912.23,425.2595" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.7349" x="793" y="333.5332">a promotion place</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.1953" x="799.7698" y="349.2627">a field can have</text></g><!--SRC=[ZLLDQzj04BtxLmm-f1OrJaAX1zKnXD92eO5G7tefcB4qiXPBks9tbDGj_U-T_R0bEodqfDtPcJTlPtQUM753y14jaOKPTtbUX7MM0zS43PQb79WARAzt3cO8HOFE0J8WDFH4JGQeo-3C7il9KWwBHhLRK3ofLKb0RSS7QAdTadKJjrUwGuijT5ZiSKThFWW9ImMZtZKqSWZ9xfcjslPCNmgZr-eNmSraaa9XQYIrXSAqdT6asKtXzmGIowaZT4Rd-LgGIwLtKq07ws0ycWPdkOtcFDy_uC_7lcc4Qd0VjfC_exn3hSOPlyQ2BPUERL_mQXNE0Dx6-kMWD4T3PqrhM1czwHeiQ7pKAhs9p8U8FwSKZzRiBCdYzIHZe5utfjXJERPT0eifD4uCMsEQirJJU46eUbrugh4WyRLyrfv19SlXU63YY_WjNFaEthqVR0zAhnE1ExYzYGTFsAWIcMRINyUfXbUPC3ATnyLc-UYVmoThZLsDObB0iI9NStY1aExaByveMHg-GJvFD0-F-pnTGap9AgMLgrDFPlzA9ziQsyuNebPTREivXV_5SHtgPRHTlk3L70Ju81DwXjpYOTEQ9zhqtMLHBXoJqsl7ll53SnUBLMBqmdmCbe4uFpWVBOWY4lc-SH0gyaCh7SpZObt032Cd40YdKJaY85IAcX8Ar53Z4qsqOP9RC9lMYzM97qXq60ebaZL8boY5TrFieeQ9i6sfCHNJF2