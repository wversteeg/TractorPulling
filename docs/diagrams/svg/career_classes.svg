5" y="265.5371">+move_up(Progress&amp;) : bool</text></g><g id="elem_GMN13"><path d="M183.5,511.9395 L183.5,632.0459 A0,0 0 0 0 183.5,632.0459 L592.5894,632.0459 A0,0 0 0 0 592.5894,632.0459 L592.5894,521.9395 L582.5894,511.9395 L392,511.9395 L388,449.0295 L384,511.9395 L183.5,511.9395 A0,0 0 0 0 183.5,511.9395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M582.5894,511.9395 L582.5894,521.9395 L592.5894,521.9395 L582.5894,511.9395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.1021" x="189.5" y="529.5332">a rung is a class at one of its levels (belofte, promo, top).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.0586" x="189.5" y="545.2627">A season finished at promotion_place or better (1: the title)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.0894" x="189.5" y="560.9922">opens the rung above; the player is asked whether to move up.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.646" x="189.5" y="576.7217">A rung opened stays open: a player who stays to defend the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360.8389" x="189.5" y="592.4512">title may move up after a later season. starting_at() starts a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.1274" x="189.5" y="608.1807">career on any rung, for testing. Which rung is which (season,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.2573" x="189.5" y="623.9102">garage, rules) is the data's (data/careers/)</text></g><!--link CareerFns to Ladder--><g id="link_CareerFns_Ladder"><path codeLine="30" d="M278.5,273.2295 C263.8,305.5895 250.6