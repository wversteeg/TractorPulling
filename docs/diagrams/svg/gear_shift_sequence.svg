<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="610px" preserveAspectRatio="none" style="width:997px;height:610px;background:#FFFFFF;" version="1.1" viewBox="0 0 997 610" width="997px" zoomAndPan="magnify"><title>Changing gear (between steps)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="215.1953" x="391.9197" y="28.5625">Changing gear (between steps)</text><rect fill="none" height="342.2236" style="stroke:#000000;stroke-width:1.5;" width="980.0347" x="10" y="198.0068"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="140" x2="140" y1="91.8184" y2="557.2305"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="390.7148" x2="390.7148" y1="91.8184" y2="557.2305"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="527.3545" x2="527.3545" y1="91.8184" y2="557.2305"/><rect fill="#E2E2F0" height="47.8789" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="241.4385" x="20" y="42.9395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.3018" x="121.5684" y="63.502">Caller</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.4385" x="27" y="80.4414">(tool or test; later the vehicle step)</text><rect fill="#E2E2F0" height="47.8789" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="241.4385" x="20" y="556.2305"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.3018" x="121.5684" y="576.793">Caller</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.4385" x="27" y="593.7324">(tool or test; later the vehicle step)</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="145.6396" x="318.7148" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.6396" x="325.7148" y="80.4414">clutch::capacity_nm</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="145.6396" x="318.7148" y="556.2305"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.6396" x="325.7148" y="576.793">clutch::capacity_nm</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="107.3652" x="474.3545" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.3652" x="481.3545" y="80.4414">driveline::shift</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="107.3652" x="474.3545" y="556.2305"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.3652" x="481.3545" y="576.793">driveline::shift</text><polygon fill="#181818" points="379.5347,119.5479,389.5347,123.5479,379.5347,127.5479,383.5347,123.5479" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="140.7192" x2="385.5347" y1="123.5479" y2="123.5479"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="5.605" x="147.7192" y="118.4121">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.2104" x="157.3242" y="118.4121">capacity_nm(clutch_params, pedal)</text><polygon fill="#181818" points="151.7192,149.2773,141.7192,153.2773,151.7192,157.2773,147.7192,153.2773" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="145.7192" x2="390.5347" y1="153.2773" y2="153.2773"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.1885" x="157.7192" y="148.1416">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.998" x="169.9077" y="148.1416">0 when the pedal is fully pressed</text><polygon fill="#181818" points="516.0371,179.0068,526.0371,183.0068,516.0371,187.0068,520.0371,183.0068" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="140.7192" x2="522.0371" y1="183.0068" y2="183.0068"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3916" x="147.7192" y="177.8711">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.981" x="160.1108" y="177.8711">shift(state, params, gear, capacity == 0)</text><path d="M10,198.0068 L70.8311,198.0068 L70.8311,205.7363 L60.8311,215.7363 L10,215.7363 L10,198.0068 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="342.2236" style="stroke:#000000;stroke-width:1.5;" width="980.0347" x="10" y="198.0068"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="25" y="211.6006">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="64.4048" x="85.8311" y="210.6631">[same gear]</text><polygon fill="#181818" points="151.7192,233.4658,141.7192,237.4658,151.7192,241.4658,147.7192,237.4658" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="145.7192" x2="527.0371" y1="237.4658" y2="237.4658"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.7915" x="157.7192" y="232.3301">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.8853" x="170.5107" y="232.3301">true (nothing to do)</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="990.0347" y1="246.4658" y2="246.4658"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="278.0024" x="15" y="257.1221">[gear does not exist, or clutch still transmits torque]</text><polygon fill="#181818" points="151.7192,278.5049,141.7192,282.5049,151.7192,286.5049,147.7192,282.5049" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="145.7192" x2="527.0371" y1="282.5049" y2="282.5049"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3091" x="157.7192" y="277.3691">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.4775" x="170.0283" y="277.3691">false, gear unchanged</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="990.0347" y1="291.5049" y2="291.5049"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="59.7964" x="15" y="302.1611">[to neutral]</text><line style="stroke:#181818;stroke-width:1.0;" x1="528.0371" x2="570.0371" y1="327.5439" y2="327.5439"/><line style="stroke:#181818;stroke-width:1.0;" x1="570.0371" x2="570.0371" y1="327.5439" y2="340.5439"/><line style="stroke:#181818;stroke-width:1.0;" x1="529.0371" x2="570.0371" y1="340.5439" y2="340.5439"/><polygon fill="#181818" points="539.0371,336.5439,529.0371,340.5439,539.0371,344.5439,535.0371,340.5439" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="535.0371" y="322.4082">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.0308" x="547.4795" y="322.4082">gear = 0; input shaft and axle now turn freely</text><polygon fill="#181818" points="151.7192,366.2734,141.7192,370.2734,151.7192,374.2734,147.7192,370.2734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="145.7192" x2="527.0371" y1="370.2734" y2="370.2734"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.5601" x="157.7192" y="365.1377">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.4131" x="169.2793" y="365.1377">true</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="990.0347" y1="379.2734" y2="379.2734"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="64.8613" x="15" y="389.9297">[into a gear]</text><line style="stroke:#181818;stroke-width:1.0;" x1="528.0371" x2="570.0371" y1="415.3125" y2="415.3125"/><line style="stroke:#181818;stroke-width:1.0;" x1="570.0371" x2="570.0371" y1="415.3125" y2="428.3125"/><line style="stroke:#181818;stroke-width:1.0;" x1="529.0371" x2="570.0371" y1="428.3125" y2="428.3125"/><polygon fill="#181818" points="539.0371,424.3125,529.0371,428.3125,539.0371,432.3125,535.0371,428.3125" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4614" x="535.0371" y="410.1768">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.4409" x="547.4985" y="410.1768">gear = g, G = gear_ratio * final_drive</text><line style="stroke:#181818;stroke-width:1.0;" x1="528.0371" x2="570.0371" y1="489.501" y2="489.501"/><line style="stroke:#181818;stroke-width:1.0;" x1="570.0371" x2="570.0371" y1="489.501" y2="502.501"/><line style="stroke:#181818;stroke-width:1.0;" x1="529.0371" x2="570.0371" y1="502.501" y2="502.501"/><polygon fill="#181818" points="539.0371,498.501,529.0371,502.501,539.0371,506.501,535.0371,502.501" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="535.0371" y="468.6357">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.9678" x="547.4795" y="452.9063">synchronize (inelastic, momentum conserved):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="430.5552" x="547.4795" y="468.6357">omega_axle = (I_out omega_axle + I_in G omega_in) / (I_out + I_in G^2)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.1479" x="547.4795" y="484.3652">omega_in = G omega_axle</text><polygon fill="#181818" points="151.7192,528.2305,141.7192,532.2305,151.7192,536.2305,147.7192,532.2305" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="145.7192" x2="527.0371" y1="532.2305" y2="532.2305"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.3711" x="157.7192" y="527.0947">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.4131" x="176.0903" y="527.0947">true</text><!--SRC=[VLB1Rjim3BtxAuYUxCr5YnrTf9SUXfvxBMQmDXqJa2bFef9cNpzQJj9awtQoIF6zn_SiPNK4JoFAbcKBMy80vHlfdaWWAisnAZ2fbpIzKIXc3CeTpoWADq_e78LNATLx1pw0KjG7SAXavv5WHoDtHh_mL3U04LR8DKtdadPZqtGuOyTwQ6KwpgxrzNGVU4UEXPecZZne7drPJaMniiFjunaB3LpGbgjKQuGunHfcwj5LnNduDYCpHmFti1yjWyL7dWEEC2Jd3Z07Yf7w2xciRvYyKHdL4Z3seygIQNrU0pORkBTCdKB4YV9j0KU6gmKq989Il8xBdr4FlQyASd75M4KHx1RedQFMI_whFOkRdJCuIfnOeq73pqIVYmneXEkEaAHRte4voogcA9ICndr0FwncX5bv09OvcPaHhO_I0xxRBnU_1qr1O0X4xl1lXwiMYwdX7s7y9RQjuVloiQeDgEpX2mmiwDhyAZv3neEP2bxubsLfhyQXfTFLCFc9HDC4dPT8OKTzrRoADRVOPWCRA9zRRyOkUb_XkMM