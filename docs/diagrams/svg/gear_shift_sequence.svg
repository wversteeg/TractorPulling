font-size="14" lengthAdjust="spacing" textLength="115.0625" x="27" y="853.2979">(the vehicle step)</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="145.6396" x="380.2798" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.6396" x="387.2798" y="80.4414">clutch::capacity_nm</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="145.6396" x="380.2798" y="815.7959"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.6396" x="387.2798" y="836.3584">clutch::capacity_nm</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="186.9082" x="535.9194" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.9082" x="542.9194" y="80.4414">driveline::shift_under_load</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="186.9082" x="535.9194" y="815.7959"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.9082" x="542.9194" y="836.3584">driveline::shift_under_load</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="107.3652" x="869.7314" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.3652" x="876.7314" y="80.4414">driveline::shift</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="107.3652" x="869.7314" y="815.7959"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.3652" x="876.7314" y="836.3584">driveline::shift</text><polygon fill="#181818" points="441.0996,119.5479,451.0996,123.5479,441.0996,127.5479,445.0996,123.5479" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="84.5313" x2="447.0996" y1="123.5479" y2="123.5479"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="5.605" x="91.5313" y="118.4121">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.2104" x="101.1362" y="118.4121">capacity_nm(clutch_params, pedal)</text><polygon fill="#181818" points="95.5313,149.2773,85.5313,153.2773,95.5313,157.2773,91.5313,153.2773" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="452.0996" y1="153.2773" y2="153.2773"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.1885" x="101.5313" y="148.1416">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.998" x="113.7197" y="148.1416">0 when the pedal is fully pressed</text><path d="M10,168.2773 L75.9282,168.2773 L75.9282,176.0068 L65.9282,186.0068 L10,186.0068 L10,168.2773 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="245.5654" style="stroke:#000000;stroke-width:1.5;" width="918.4141" x="10" y="168.2773"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.9282" x="25" y="181.8711">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="435.0156" x="90.9282" y="180.9336">[clutch in and shifts_under_load(params, gear in, gear) (a powershift step down)]</text><polygon fill="#181818" points="617.3735,203.7363,627.3735,207.7363,617.3735,211.7363,621.3735,207.7363" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="84.5313" x2="623.3735" y1="207.7363" y2="207.7363"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3916" x="91.5313" y="202.6006">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.6045" x="103.9229" y="202.6006">shift_under_load(state, params, gear)</text><line style="stroke:#181818;stroke-width:1.0;" x1="629.3735" x2="671.3735" y1="253.1953" y2="253.1953"/><line style="stroke:#181818;stroke-width:1.0;" x1="671.3735" x2="671.3735" y1="253.1953" y2="266.1953"/><line style="stroke:#181818;stroke-width:1.0;" x1="630.3735" x2="671.3735" y1="266.1953" y2="266.1953"/><polygon fill="#181818" points="640.3735,262.1953,630.3735,266.1953,640.3735,270.1953,636.3735,266.1953" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.7915" x="636.3735" y="240.1948">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.7197" x="649.165" y="232.3301">gear = g; the axle keeps its speed;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.249" x="649.165" y="248.0596">omega_in = G omega_axle (the packs' side)</text><polygon fill="#181818" points="95.5313,307.6543,85.5313,311.6543,95.5313,315.6543,91.5313,311.6543" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="628.3735" y1="311.6543" y2="311.6543"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3091" x="101.5313" y="298.6538">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.3569" x="113.8403" y="290.7891">the input shaft's change of momentum,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.1621" x="113.8403" y="306.5186">I_in (omega_in' - omega_in)</text><line style="stroke:#181818;stroke-width:1.0;" x1="84.5313" x2="126.5313" y1="341.3838" y2="341.3838"/><line style="stroke:#181818;stroke-width:1.0;" x1="126.5313" x2="126.5313" y1="341.3838" y2="354.3838"/><line style="stroke:#181818;stroke-width:1.0;" x1="85.5313" x2="126.5313" y1="354.3838" y2="354.3838"/><polygon fill="#181818" points="95.5313,350.3838,85.5313,354.3838,95.5313,358.3838,91.5313,354.3838" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="91.5313" y="336.248">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.126" x="103.9736" y="336.248">the engine gives it: omega_engine -= impulse / I_engine</text><path d="M89,367.3838 L89,408.3838 L444,408.3838 L444,377.3838 L434,367.3838 L89,367.3838 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M434,367.3838 L434,377.3838 L444,377.3838 L434,367.3838 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.4263" x="95" y="384.9775">the input shaft now turns faster than the engine:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.915" x="95" y="400.707">the clutch slips, at most its capacity, until it catches up</text><polygon fill="#181818" points="911.4141,438.5723,921.4141,442.5723,911.4141,446.5723,915.4141,442.5723" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="84.5313" x2="917.4141" y1="442.5723" y2="442.5723"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.5601" x="91.5313" y="437.4365">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.8184" x="103.0913" y="437.4365">otherwise: shift(state, params, gear, capacity == 0)</text><path d="M10,457.5723 L70.8311,457.5723 L70.8311,465.3018 L60.8311,475.3018 L10,475.3018 L10,457.5723 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="342.2236" style="stroke:#000000;stroke-width:1.5;" width="1380.9658" x="10" y="457.5723"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="25" y="471.166">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="64.4048" x="85.8311" y="470.2285">[same gear]</text><polygon fill="#181818" points="95.5313,493.0313,85.5313,497.0313,95.5313,501.0313,91.5313,497.0313" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="922.4141" y1="497.0313" y2="497.0313"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4614" x="101.5313" y="491.8955">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.8853" x="113.9927" y="491.8955">true (nothing to do)</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="1390.9658" y1="506.0313" y2="506.0313"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="278.0024" x="15" y="516.6875">[gear does not exist, or clutch still transmits torque]</text><polygon fill="#181818" points="95.5313,538.0703,85.5313,542.0703,95.5313,546.0703,91.5313,542.0703" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="922.4141" y1="542.0703" y2="542.0703"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="101.5313" y="536.9346">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.4775" x="113.9736" y="536.9346">false, gear unchanged</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="1390.9658" y1="551.0703" y2="551.0703"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="59.7964" x="15" y="561.7266">[to neutral]</text><line style="stroke:#181818;stroke-width:1.0;" x1="923.4141" x2="965.4141" y1="587.1094" y2="587.1094"/><line style="stroke:#181818;stroke-width:1.0;" x1="965.4141" x2="965.4141" y1="587.1094" y2="600.1094"/><line style="stroke:#181818;stroke-width:1.0;" x1="924.4141" x2="965.4141" y1="600.1094" y2="600.1094"/><polygon fill="#181818" points="934.4141,596.1094,924.4141,600.1094,934.4141,604.1094,930.4141,600.1094" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.3711" x="930.4141" y="581.9736">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.0308" x="948.7852" y="581.9736">gear = 0; input shaft and axle now turn freely</text><polygon fill="#181818" points="95.5313,625.8389,85.5313,629.8389,95.5313,633.8389,91.5313,629.8389" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="922.4141" y1="629.8389" y2="629.8389"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="11.21" x="101.5313" y="624.7031">11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.4131" x="116.7412" y="624.7031">true</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="1390.9658" y1="638.8389" y2="638.8389"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="64.8613" x="15" y="649.4951">[into a gear]</text><line style="stroke:#181818;stroke-width:1.0;" x1="923.4141" x2="965.4141" y1="674.8779" y2="674.8779"/><line style="stroke:#181818;stroke-width:1.0;" x1="965.4141" x2="965.4141" y1="674.8779" y2="687.8779"/><line style="stroke:#181818;stroke-width:1.0;" x1="924.4141" x2="965.4141" y1="687.8779" y2="687.8779"/><polygon fill="#181818" points="934.4141,683.8779,924.4141,687.8779,934.4141,691.8779,930.4141,687.8779" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.7935" x="930.4141" y="669.7422">12</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.4409" x="948.2075" y="669.7422">gear = g, G = gear_ratio * final_drive</text><line style="stroke:#181818;stroke-width:1.0;" x1="923.4141" x2="965.4141" y1="749.0664" y2="749.0664"/><line style="stroke:#181818;stroke-width:1.0;" x1="965.4141" x2="965.4141" y1="749.0664" y2="762.0664"/><line style="stroke:#181818;stroke-width:1.0;" x1="924.4141" x2="965.4141" y1="762.0664" y2="762.0664"/><polygon fill="#181818" points="934.4141,758.0664,924.4141,762.0664,934.4141,766.0664,930.4141,762.0664" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.9966" x="930.4141" y="728.2012">13</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.9678" x="948.4106" y="712.4717">synchronize (inelastic, momentum conserved):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="430.5552" x="948.4106" y="728.2012">omega_axle = (I_out omega_axle + I_in G omega_in) / (I_out + I_in G^2)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.1479" x="948.4106" y="743.9307">omega_in = G omega_axle</text><polygon fill="#181818" points="95.5313,787.7959,85.5313,791.7959,95.5313,795.7959,91.5313,791.7959" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="922.4141" y1="791.7959" y2="791.7959"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.3965" x="101.5313" y="786.6602">14</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.4131" x="119.9277" y="786.6602">true</text><!--SRC=[VLHDRvmm4BtpAqQv15fMZNeaefSSeaYzzRegSl00LioO-YERxQ_lsC0kcsPpi_7Cc_Tctk2LrmWFWw1UKGyz2WlvC_e38e7pEBaY4y4R2kCpscmIrgjMJO8yt3m8hT7kAVS3mYiEgcMec5FSW70mFr-cj3huTgYgLaoYLVxOqBZ4plVBQ6dLAsf5M5LkK9rl0acqZJP2fgoVVFWy8uNzYgSic_d0xiUf6bIm8PBFv1e65AChOK8fT96TWdSfCs5KS0U7WJiKbQSuK0wweFKH9elEeSpCv65614KWI49Yv3OYyhLKQhkY-L10Bc0o1xGf8NKKf3bGaG6SHKJnJEHzOtBdXKTclu6EYIdyd9Ogrj3V9mdYZIVtWZnjKDw1cn3b_PxCYBrec7qDZp1VKcGQE7VbnTs2KnBF-DiMnI15Ks05W-ZyhOCssWp1T30o6lambdjwYWNojTGjx60zN-gzmCLeLuIUfnqfLqlEydbNWngde1t2DtXQlZ8O6OzWLJ_uoE4QKGuxW0-MUAA2csyvGD2cRBMdU5c6wxIQkC_2ioZdK_zMKvKGo2ls1Zj1S2np3LE693TUJEPa4eOXxK4vN4RwqHpB4pBKDTpnPchcB4PChonm1hkSWWqyC5O-nFtsXfrKP1XRaomW3PFYLy0tvNm9nfvqCNFDwOBS64LvO_y4_BX89nXmiN6WUSnohi8L2GF3w7FgMVLYmxlxYm74PKb6MoS1dKNKn-iAvrgAk9furup_YlKbkxbEjyOAhmnyWKwHq4twUtoKwOuioXfIVxcNx03Dlb1jUR8nj8OSsbUKHRMkJH9GG_xK61Qs-VOLakKVppvdbovXwzllxyNLzVki2oJ_0G00]--></g></svg><!-- plantuml-source-sha256: 0aa4d56b82bcf70b2bff810d71f5dd11c2523d5e601c592a5b22cb08cdc6ebe5 -->