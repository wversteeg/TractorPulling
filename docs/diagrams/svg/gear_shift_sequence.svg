<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="881px" preserveAspectRatio="none" style="width:1432px;height:881px;background:#FFFFFF;" version="1.1" viewBox="0 0 1432 881" width="1432px" zoomAndPan="magnify"><title>Changing gear (between steps)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="215.1953" x="609.8" y="28.5625">Changing gear (between steps)</text><rect fill="none" height="257.1846" style="stroke:#000000;stroke-width:1.5;" width="953.2437" x="10" y="168.2773"/><rect fill="none" height="342.2236" style="stroke:#000000;stroke-width:1.5;" width="1415.7954" x="10" y="469.1914"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="84" x2="84" y1="91.8184" y2="828.415"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="452.2798" x2="452.2798" y1="91.8184" y2="828.415"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="628.9194" x2="628.9194" y1="91.8184" y2="828.415"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="957.561" x2="957.561" y1="91.8184" y2="828.415"/><rect fill="#E2E2F0" height="47.8789" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="129.0625" x="20" y="42.9395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.3018" x="65.3804" y="63.502">Caller</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.0625" x="27" y="80.4414">(the vehicle step)</text><rect fill="#E2E2F0" height="47.8789" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="129.0625" x="20" y="827.415"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.3018" x="65.3804" y="847.9775">Caller</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.0625" x="27" y="864.917">(the vehicle step)</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="145.6396" x="380.2798" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.6396" x="387.2798" y="80.4414">clutch::capacity_nm</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="145.6396" x="380.2798" y="827.415"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.6396" x="387.2798" y="847.9775">clutch::capacity_nm</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="186.9082" x="535.9194" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.9082" x="542.9194" y="80.4414">driveline::shift_under_load</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="186.9082" x="535.9194" y="827.415"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.9082" x="542.9194" y="847.9775">driveline::shift_under_load</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="107.3652" x="904.561" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.3652" x="911.561" y="80.4414">driveline::shift</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="107.3652" x="904.561" y="827.415"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.3652" x="911.561" y="847.9775">driveline::shift</text><polygon fill="#181818" points="441.0996,119.5479,451.0996,123.5479,441.0996,127.5479,445.0996,123.5479" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="84.5313" x2="447.0996" y1="123.5479" y2="123.5479"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="5.605" x="91.5313" y="118.4121">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.2104" x="101.1362" y="118.4121">capacity_nm(clutch_params, pedal)</text><polygon fill="#181818" points="95.5313,149.2773,85.5313,153.2773,95.5313,157.2773,91.5313,153.2773" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="452.0996" y1="153.2773" y2="153.2773"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.1885" x="101.5313" y="148.1416">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.998" x="113.7197" y="148.1416">0 when the pedal is fully pressed</text><path d="M10,168.2773 L75.9282,168.2773 L75.9282,176.0068 L65.9282,186.0068 L10,186.0068 L10,168.2773 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="257.1846" style="stroke:#000000;stroke-width:1.5;" width="953.2437" x="10" y="168.2773"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.9282" x="25" y="181.8711">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="284.1094" x="90.9282" y="180.9336">[clutch in and shifts_under_load(state, params, gear)</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="295.3027" x="90.9282" y="194.2432">(a powershift step down, with a load shift left this pull)]</text><polygon fill="#181818" points="617.3735,215.3555,627.3735,219.3555,617.3735,223.3555,621.3735,219.3555" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="84.5313" x2="623.3735" y1="219.3555" y2="219.3555"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3916" x="91.5313" y="214.2197">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.6045" x="103.9229" y="214.2197">shift_under_load(state, params, gear)</text><line style="stroke:#181818;stroke-width:1.0;" x1="629.3735" x2="671.3735" y1="264.8145" y2="264.8145"/><line style="stroke:#181818;stroke-width:1.0;" x1="671.3735" x2="671.3735" y1="264.8145" y2="277.8145"/><line style="stroke:#181818;stroke-width:1.0;" x1="630.3735" x2="671.3735" y1="277.8145" y2="277.8145"/><polygon fill="#181818" points="640.3735,273.8145,630.3735,277.8145,640.3735,281.8145,636.3735,277.8145" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.7915" x="636.3735" y="251.814">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.0786" x="649.165" y="243.9492">gear = g, ++load_shifts; the axle keeps its speed;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.249" x="649.165" y="259.6787">omega_in = G omega_axle (the packs' side)</text><polygon fill="#181818" points="95.5313,319.2734,85.5313,323.2734,95.5313,327.2734,91.5313,323.2734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="628.3735" y1="323.2734" y2="323.2734"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3091" x="101.5313" y="310.2729">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.3569" x="113.8403" y="302.4082">the input shaft's change of momentum,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.1621" x="113.8403" y="318.1377">I_in (omega_in' - omega_in)</text><line style="stroke:#181818;stroke-width:1.0;" x1="84.5313" x2="126.5313" y1="353.0029" y2="353.0029"/><line style="stroke:#181818;stroke-width:1.0;" x1="126.5313" x2="126.5313" y1="353.0029" y2="366.0029"/><line style="stroke:#181818;stroke-width:1.0;" x1="85.5313" x2="126.5313" y1="366.0029" y2="366.0029"/><polygon fill="#181818" points="95.5313,362.0029,85.5313,366.0029,95.5313,370.0029,91.5313,366.0029" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="91.5313" y="347.8672">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.126" x="103.9736" y="347.8672">the engine gives it: omega_engine -= impulse / I_engine</text><path d="M89,379.0029 L89,420.0029 L444,420.0029 L444,389.0029 L434,379.0029 L89,379.0029 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M434,379.0029 L434,389.0029 L444,389.0029 L434,379.0029 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.4263" x="95" y="396.5967">the input shaft now turns faster than the engine:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.915" x="95" y="412.3262">the clutch slips, at most its capacity, until it catches up</text><polygon fill="#181818" points="946.2437,450.1914,956.2437,454.1914,946.2437,458.1914,950.2437,454.1914" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="84.5313" x2="952.2437" y1="454.1914" y2="454.1914"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.5601" x="91.5313" y="449.0557">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.8184" x="103.0913" y="449.0557">otherwise: shift(state, params, gear, capacity == 0)</text><path d="M10,469.1914 L70.8311,469.1914 L70.8311,476.9209 L60.8311,486.9209 L10,486.9209 L10,469.1914 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="342.2236" style="stroke:#000000;stroke-width:1.5;" width="1415.7954" x="10" y="469.1914"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="25" y="482.7852">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="64.4048" x="85.8311" y="481.8477">[same gear]</text><polygon fill="#181818" points="95.5313,504.6504,85.5313,508.6504,95.5313,512.6504,91.5313,508.6504" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="957.2437" y1="508.6504" y2="508.6504"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4614" x="101.5313" y="503.5146">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.8853" x="113.9927" y="503.5146">true (nothing to do)</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="1425.7954" y1="517.6504" y2="517.6504"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="278.0024" x="15" y="528.3066">[gear does not exist, or clutch still transmits torque]</text><polygon fill="#181818" points="95.5313,549.6895,85.5313,553.6895,95.5313,557.6895,91.5313,553.6895" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="957.2437" y1="553.6895" y2="553.6895"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="101.5313" y="548.5537">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.4775" x="113.9736" y="548.5537">false, gear unchanged</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="1425.7954" y1="562.6895" y2="562.6895"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="59.7964" x="15" y="573.3457">[to neutral]</text><line style="stroke:#181818;stroke-width:1.0;" x1="958.2437" x2="1000.2437" y1="598.7285" y2="598.7285"/><line style="stroke:#181818;stroke-width:1.0;" x1="1000.2437" x2="1000.2437" y1="598.7285" y2="611.7285"/><line style="stroke:#181818;stroke-width:1.0;" x1="959.2437" x2="1000.2437" y1="611.7285" y2="611.7285"/><polygon fill="#181818" points="969.2437,607.7285,959.2437,611.7285,969.2437,615.7285,965.2437,611.7285" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.3711" x="965.2437" y="593.5928">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.0308" x="983.6147" y="593.5928">gear = 0; input shaft and axle now turn freely</text><polygon fill="#181818" points="95.5313,637.458,85.5313,641.458,95.5313,645.458,91.5313,641.458" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="957.2437" y1="641.458" y2="641.458"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="11.21" x="101.5313" y="636.3223">11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.4131" x="116.7412" y="636.3223">true</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="1425.7954" y1="650.458" y2="650.458"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="64.8613" x="15" y="661.1143">[into a gear]</text><line style="stroke:#181818;stroke-width:1.0;" x1="958.2437" x2="1000.2437" y1="686.4971" y2="686.4971"/><line style="stroke:#181818;stroke-width:1.0;" x1="1000.2437" x2="1000.2437" y1="686.4971" y2="699.4971"/><line style="stroke:#181818;stroke-width:1.0;" x1="959.2437" x2="1000.2437" y1="699.4971" y2="699.4971"/><polygon fill="#181818" points="969.2437,695.4971,959.2437,699.4971,969.2437,703.4971,965.2437,699.4971" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.7935" x="965.2437" y="681.3613">12</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.4409" x="983.0371" y="681.3613">gear = g, G = gear_ratio * final_drive</text><line style="stroke:#181818;stroke-width:1.0;" x1="958.2437" x2="1000.2437" y1="760.6855" y2="760.6855"/><line style="stroke:#181818;stroke-width:1.0;" x1="1000.2437" x2="1000.2437" y1="760.6855" y2="773.6855"/><line style="stroke:#181818;stroke-width:1.0;" x1="959.2437" x2="1000.2437" y1="773.6855" y2="773.6855"/><polygon fill="#181818" points="969.2437,769.6855,959.2437,773.6855,969.2437,777.6855,965.2437,773.6855" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.9966" x="965.2437" y="739.8203">13</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.9678" x="983.2402" y="724.0908">synchronize (inelastic, momentum conserved):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="430.5552" x="983.2402" y="739.8203">omega_axle = (I_out omega_axle + I_in G omega_in) / (I_out + I_in G^2)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.1479" x="983.2402" y="755.5498">omega_in = G omega_axle</text><polygon fill="#181818" points="95.5313,799.415,85.5313,803.415,95.5313,807.415,91.5313,803.415" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="957.2437" y1="803.415" y2="803.415"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.3965" x="101.5313" y="798.2793">14</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.4131" x="119.9277" y="798.2793">true</text><!--SRC=[VLHBRzim3BxxLn2xD5uThDZHHNRfeIYmswx13DQcOw4ovKbqtUpNZvATLvVsalX1ydlmayM89NZea7U6Tx0ZzB1w9fc868BG4F8CHt4yzi_aim6zcDeCo09V7j1QybjUIKVmIfsfTLJioRy01fXVNxRKTfIwAyiQ1woDx2lkbzhv_hAwyUQLh64goz2PLggH6_ALTTYahfzwyNb7AliLhx9ivWFh7qSqAE6Co6ecL-b0x4C10pLey-nOl4wTQKO9Tp1rwb1Kdkh016X7Q_SmU0g1cimD0lD4C0p83IH6uKp4AWWAATA26DtFrK-4mKtaKtqo51etSG6JaGuGOkiy32pfZtGAFYXudW6SL4PtbEbxvww2QcCgFxMb96nWLy3jRMohPlRtIJA-wQPVIDC1HWA4WQYvtxBhQOULgjt08ymtgJ85H5ry2JSGJ4Cdk7DBOv7XOLJ97RPo4w2EiIHmBVGwZMNiYoq_HO3L0Ue6rd2ulfH_CPTYl0bscev8kLnwbiVh3PXU3Gm4t-1fUQh3s0c1DxjE8eUFY6hP139wrWIWRijh0V8PRBdbUBE48LWpgEqeAYf8ykyGmW965gDPqkIWrYhNSSY8cxFifZ0h2QSZ_MG2BHk-jjRYE1as6xZJasoLC_QKtgh0UTZb5loe2rFbNVmUYDFevHb5Qr8Y6gUaz2tGcmbIWFD7NShSQZjowACeSVxFIDT1MjI1CqULFA-vcL4KaMdKCVRKUbAzfFBk_c81yN2be1qs0QqdilkF5SvOXXKDtvdn7vWUWSVuftULHp4Ela9h66sLlZRNEiDUHNd7vgzwgGcmcWjJ5ySOG-qua7-b9YyFnoO9sC3ggN8gxEpPBQJ8FvvohYbToWxlVd_FFpn-dxd0pJy0]--></g></svg><!-- plantuml-source-sha256: 4e53a5a7eb6b2059a156fda9b67e390417f3479788b17a573b39b552b7849f67 -->