<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="968px" preserveAspectRatio="none" style="width:1553px;height:968px;background:#FFFFFF;" version="1.1" viewBox="0 0 1553 968" width="1553px" zoomAndPan="magnify"><title>Changing gear (between steps)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="215.1953" x="669.9854" y="28.5625">Changing gear (between steps)</text><rect fill="none" height="257.1846" style="stroke:#000000;stroke-width:1.5;" width="1073.2144" x="10" y="226.7363"/><rect fill="none" height="371.2627" style="stroke:#000000;stroke-width:1.5;" width="1536.166" x="10" y="527.6504"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="84" x2="84" y1="91.8184" y2="915.9131"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="451.3975" x2="451.3975" y1="91.8184" y2="915.9131"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="628.0371" x2="628.0371" y1="91.8184" y2="915.9131"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="1077.5317" x2="1077.5317" y1="91.8184" y2="915.9131"/><rect fill="#E2E2F0" height="47.8789" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="129.0625" x="20" y="42.9395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.3018" x="65.3804" y="63.502">Caller</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.0625" x="27" y="80.4414">(the vehicle step)</text><rect fill="#E2E2F0" height="47.8789" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="129.0625" x="20" y="914.9131"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.3018" x="65.3804" y="935.4756">Caller</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.0625" x="27" y="952.415">(the vehicle step)</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="145.6396" x="379.3975" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.6396" x="386.3975" y="80.4414">clutch::capacity_nm</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="145.6396" x="379.3975" y="914.9131"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.6396" x="386.3975" y="935.4756">clutch::capacity_nm</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="186.9082" x="535.0371" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.9082" x="542.0371" y="80.4414">driveline::shift_under_load</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="186.9082" x="535.0371" y="914.9131"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.9082" x="542.0371" y="935.4756">driveline::shift_under_load</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="107.3652" x="1024.5317" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.3652" x="1031.5317" y="80.4414">driveline::shift</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="107.3652" x="1024.5317" y="914.9131"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.3652" x="1031.5317" y="935.4756">driveline::shift</text><line style="stroke:#181818;stroke-width:1.0;" x1="84.5313" x2="126.5313" y1="139.2773" y2="139.2773"/><line style="stroke:#181818;stroke-width:1.0;" x1="126.5313" x2="126.5313" y1="139.2773" y2="152.2773"/><line style="stroke:#181818;stroke-width:1.0;" x1="85.5313" x2="126.5313" y1="152.2773" y2="152.2773"/><polygon fill="#181818" points="95.5313,148.2773,85.5313,152.2773,95.5313,156.2773,91.5313,152.2773" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="5.605" x="91.5313" y="126.2769">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.0688" x="101.1362" y="118.4121">moving faster than kUnderWay_m_s:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.8984" x="101.1362" y="134.1416">driveline::start_pull(state): floor_gear = gear (once)</text><polygon fill="#181818" points="440.2173,178.0068,450.2173,182.0068,440.2173,186.0068,444.2173,182.0068" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="84.5313" x2="446.2173" y1="182.0068" y2="182.0068"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.1885" x="91.5313" y="176.8711">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.2104" x="103.7197" y="176.8711">capacity_nm(clutch_params, pedal)</text><polygon fill="#181818" points="95.5313,207.7363,85.5313,211.7363,95.5313,215.7363,91.5313,211.7363" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="451.2173" y1="211.7363" y2="211.7363"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3916" x="101.5313" y="206.6006">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.998" x="113.9229" y="206.6006">0 when the pedal is fully pressed</text><path d="M10,226.7363 L75.9282,226.7363 L75.9282,234.4658 L65.9282,244.4658 L10,244.4658 L10,226.7363 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="257.1846" style="stroke:#000000;stroke-width:1.5;" width="1073.2144" x="10" y="226.7363"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.9282" x="25" y="240.3301">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="284.1094" x="90.9282" y="239.3926">[clutch in and shifts_under_load(state, params, gear)</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="295.3027" x="90.9282" y="252.7021">(a powershift step down, with a load shift left this pull)]</text><polygon fill="#181818" points="616.4912,273.8145,626.4912,277.8145,616.4912,281.8145,620.4912,277.8145" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="84.5313" x2="622.4912" y1="277.8145" y2="277.8145"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.7915" x="91.5313" y="272.6787">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.6045" x="104.3228" y="272.6787">shift_under_load(state, params, gear)</text><line style="stroke:#181818;stroke-width:1.0;" x1="628.4912" x2="670.4912" y1="323.2734" y2="323.2734"/><line style="stroke:#181818;stroke-width:1.0;" x1="670.4912" x2="670.4912" y1="323.2734" y2="336.2734"/><line style="stroke:#181818;stroke-width:1.0;" x1="629.4912" x2="670.4912" y1="336.2734" y2="336.2734"/><polygon fill="#181818" points="639.4912,332.2734,629.4912,336.2734,639.4912,340.2734,635.4912,336.2734" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3091" x="635.4912" y="310.2729">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.8149" x="647.8003" y="302.4082">gear = g, ++load_shifts, floor_gear = g once under way;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="423.4141" x="647.8003" y="318.1377">the axle keeps its speed; omega_in = G omega_axle (the packs' side)</text><polygon fill="#181818" points="95.5313,377.7324,85.5313,381.7324,95.5313,385.7324,91.5313,381.7324" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="627.4912" y1="381.7324" y2="381.7324"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="101.5313" y="368.7319">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.3569" x="113.9736" y="360.8672">the input shaft's change of momentum,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.1621" x="113.9736" y="376.5967">I_in (omega_in' - omega_in)</text><line style="stroke:#181818;stroke-width:1.0;" x1="84.5313" x2="126.5313" y1="411.4619" y2="411.4619"/><line style="stroke:#181818;stroke-width:1.0;" x1="126.5313" x2="126.5313" y1="411.4619" y2="424.4619"/><line style="stroke:#181818;stroke-width:1.0;" x1="85.5313" x2="126.5313" y1="424.4619" y2="424.4619"/><polygon fill="#181818" points="95.5313,420.4619,85.5313,424.4619,95.5313,428.4619,91.5313,424.4619" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.5601" x="91.5313" y="406.3262">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.126" x="103.0913" y="406.3262">the engine gives it: omega_engine -= impulse / I_engine</text><path d="M89,437.4619 L89,478.4619 L444,478.4619 L444,447.4619 L434,437.4619 L89,437.4619 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M434,437.4619 L434,447.4619 L444,447.4619 L434,437.4619 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.4263" x="95" y="455.0557">the input shaft now turns faster than the engine:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.915" x="95" y="470.7852">the clutch slips, at most its capacity, until it catches up</text><polygon fill="#181818" points="1066.2144,508.6504,1076.2144,512.6504,1066.2144,516.6504,1070.2144,512.6504" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="84.5313" x2="1072.2144" y1="512.6504" y2="512.6504"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4614" x="91.5313" y="507.5146">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.8184" x="103.9927" y="507.5146">otherwise: shift(state, params, gear, capacity == 0)</text><path d="M10,527.6504 L70.8311,527.6504 L70.8311,535.3799 L60.8311,545.3799 L10,545.3799 L10,527.6504 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="371.2627" style="stroke:#000000;stroke-width:1.5;" width="1536.166" x="10" y="527.6504"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="25" y="541.2441">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="64.4048" x="85.8311" y="540.3066">[same gear]</text><polygon fill="#181818" points="95.5313,563.1094,85.5313,567.1094,95.5313,571.1094,91.5313,567.1094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="1077.2144" y1="567.1094" y2="567.1094"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="101.5313" y="561.9736">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.8853" x="113.9736" y="561.9736">true (nothing to do)</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="1546.166" y1="576.1094" y2="576.1094"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="263.6992" x="15" y="586.7656">[gear does not exist, clutch still transmits torque,</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="190.0884" x="15" y="600.0752">or under way and below floor_gear]</text><polygon fill="#181818" points="95.5313,621.458,85.5313,625.458,95.5313,629.458,91.5313,625.458" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="1077.2144" y1="625.458" y2="625.458"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.3711" x="101.5313" y="620.3223">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.4775" x="119.9023" y="620.3223">false, gear unchanged</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="1546.166" y1="634.458" y2="634.458"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="59.7964" x="15" y="645.1143">[to neutral]</text><line style="stroke:#181818;stroke-width:1.0;" x1="1078.2144" x2="1120.2144" y1="670.4971" y2="670.4971"/><line style="stroke:#181818;stroke-width:1.0;" x1="1120.2144" x2="1120.2144" y1="670.4971" y2="683.4971"/><line style="stroke:#181818;stroke-width:1.0;" x1="1079.2144" x2="1120.2144" y1="683.4971" y2="683.4971"/><polygon fill="#181818" points="1089.2144,679.4971,1079.2144,683.4971,1089.2144,687.4971,1085.2144,683.4971" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="11.21" x="1085.2144" y="665.3613">11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.0308" x="1100.4243" y="665.3613">gear = 0; input shaft and axle now turn freely</text><polygon fill="#181818" points="95.5313,709.2266,85.5313,713.2266,95.5313,717.2266,91.5313,713.2266" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="1077.2144" y1="713.2266" y2="713.2266"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.7935" x="101.5313" y="708.0908">12</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.4131" x="119.3247" y="708.0908">true</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="1546.166" y1="722.2266" y2="722.2266"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="64.8613" x="15" y="732.8828">[into a gear]</text><line style="stroke:#181818;stroke-width:1.0;" x1="1078.2144" x2="1120.2144" y1="773.9951" y2="773.9951"/><line style="stroke:#181818;stroke-width:1.0;" x1="1120.2144" x2="1120.2144" y1="773.9951" y2="786.9951"/><line style="stroke:#181818;stroke-width:1.0;" x1="1079.2144" x2="1120.2144" y1="786.9951" y2="786.9951"/><polygon fill="#181818" points="1089.2144,782.9951,1079.2144,786.9951,1089.2144,790.9951,1085.2144,786.9951" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.9966" x="1085.2144" y="760.9946">13</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.3638" x="1103.2109" y="753.1299">gear = g, G = gear_ratio * final_drive;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.4805" x="1103.2109" y="768.8594">under way, floor_gear = g (up only)</text><line style="stroke:#181818;stroke-width:1.0;" x1="1078.2144" x2="1120.2144" y1="848.1836" y2="848.1836"/><line style="stroke:#181818;stroke-width:1.0;" x1="1120.2144" x2="1120.2144" y1="848.1836" y2="861.1836"/><line style="stroke:#181818;stroke-width:1.0;" x1="1079.2144" x2="1120.2144" y1="861.1836" y2="861.1836"/><polygon fill="#181818" points="1089.2144,857.1836,1079.2144,861.1836,1089.2144,865.1836,1085.2144,861.1836" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.3965" x="1085.2144" y="827.3184">14</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.9678" x="1103.6108" y="811.5889">synchronize (inelastic, momentum conserved):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="430.5552" x="1103.6108" y="827.3184">omega_axle = (I_out omega_axle + I_in G omega_in) / (I_out + I_in G^2)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.1479" x="1103.6108" y="843.0479">omega_in = G omega_axle</text><polygon fill="#181818" points="95.5313,886.9131,85.5313,890.9131,95.5313,894.9131,91.5313,890.9131" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="89.5313" x2="1077.2144" y1="890.9131" y2=