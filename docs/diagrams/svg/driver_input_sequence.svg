 y="118.4121">input(plan, driver state, t_s, tractor state, tractor params)</text><line style="stroke:#181818;stroke-width:1.0;" x1="478.8418" x2="520.8418" y1="153.2773" y2="153.2773"/><line style="stroke:#181818;stroke-width:1.0;" x1="520.8418" x2="520.8418" y1="153.2773" y2="166.2773"/><line style="stroke:#181818;stroke-width:1.0;" x1="479.8418" x2="520.8418" y1="166.2773" y2="166.2773"/><polygon fill="#181818" points="489.8418,162.2773,479.8418,166.2773,489.8418,170.2773,485.8418,166.2773" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.1885" x="485.8418" y="148.1416">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.1509" x="498.0303" y="148.1416">before select_gear_s: neutral, clutch pressed, idle</text><line style="stroke:#181818;stroke-width:1.0;" x1="478.8418" x2="520.8418" y1="211.7363" y2="211.7363"/><line style="stroke:#181818;stroke-width:1.0;" x1="520.8418" x2="520.8418" y1="211.7363" y2="224.7363"/><line style="stroke:#181818;stroke-width:1.0;" x1="479.8418" x2="520.8418" y1="224.7363" y2="224.7363"/><polygon fill="#181818" points="489.8418,220.7363,479.8418,224.7363,489.8418,228.7363,485.8418,224.7363" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3916" x="485.8418" y="198.7358">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.3013" x="498.2334" y="190.8711">then plan.gear at plan.throttle; from launch_s the clutch</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.4648" x="498.2334" y="206.6006">comes up over clutch_slip_in_s</text><path d="M411.9951,239.7363 L477.9233,239.7363 L477.9233,247.4658 L467.9233,257.4658 L411.9951,257.4658 L411.9951,239.7363 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="237.6865" style="stroke:#000000;stroke-width:1.5;" width="555.4497" x="411.9951" y="239.7363"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.9282" x="426.9951" y="253.3301">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="238.1973" x="492.9233" y="252.3926">[plan.launch_hold_share &gt; 0 (a held launch)]</text><path d="M421.9951,264.4658 L482.8262,264.4658 L482.8262,272.1953 L472.8262,282.1953 L421.9951,282.1953 L421.9951,264.4658 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="205.957" style="stroke:#000000;stroke-width:1.5;" width="535.4497" x="421.9951" y="264.4658"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="436.9951" y="278.0596">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="412.6665" x="497.8262" y="277.1221">[plan.launch_feather_share &gt; 0 and held_s &lt; launch_hold_max_s (feathered)]</text><line style="stroke:#181818;stroke-width:1.0;" x1="478.8418" x2="520.8418" y1="303.9248" y2="303.9248"/><line style="stroke:#181818;stroke-width:1.0;" x1="520.8418" x2="520.8418" y1="303.9248" y2="316.9248"/><line style="stroke:#181818;stroke-width:1.0;" x1="479.8418" x2="520.8418" y1="316.9248" y2="316.9248"/><polygon fill="#181818" points="489.8418,312.9248,479.8418,316.9248,489.8418,320.9248,485.8418,316.9248" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.7915" x="485.8418" y="298.7891">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="361.2388" x="498.6333" y="298.7891">rate = clamp((engine - hold) / (feather_share x rated), -1, 1)</text><line style="stroke:#181818;stroke-width:1.0;" x1="478.8418" x2="520.8418" y1="346.6543" y2="346.6543"/><line style="stroke:#181818;stroke-width:1.0;" x1="520.8418" x2="520.8418" y1="346.6543" y2="359.6543"/><line style="stroke:#181818;stroke-width:1.0;" x1="479.8418" x2="520.8418" y1="359.6543" y2="359.6543"/><polygon fill="#181818" points="489.8418,355.6543,479.8418,359.6543,489.8418,363.6543,485.8418,359.6543" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3091" x="485.8418" y="341.5186">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="447.2939" x="498.1509" y="341.5186">clutch up (or back) at rate x the plan's rate; held_s += step while backing</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="421.9951" x2="957.4448" y1="368.6543" y2="368.6543"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="411.5439" x="426.9951" y="379.3105">[engine &lt; launch_hold_share x rated speed and held_s &lt; launch_hold_max_s]</text><line style="stroke:#181818;stroke-width:1.0;" x1="478.8418" x2="520.8418" y1="404.6934" y2="404.6934"/><line style="stroke:#181818;stroke-width:1.0;" x1="520.8418" x2="520.8418" y1="404.6934" y2="417.6934"/><line style="stroke:#181818;stroke-width:1.0;" x1="479.8418" x2="520.8418" y1="417.6934" y2="417.6934"/><polygon fill="#181818" points="489.8418,413.6934,479.8418,417.6934,489.8418,421.6934,485.8418,417.6934" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="485.8418" y="399.5576">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.0215" x="498.2842" y="399.5576">ease the clutch back at the same rate; held_s += step</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="421.9951" x2="957.4448" y1="426.6934" y2="426.6934"/><line style="stroke:#181818;stroke-width:1.0;" x1="478.8418" x2="520.8418" y1="449.4229" y2="449.4229"/><line style="stroke:#181818;stroke-width:1.0;" x1="520.8418" x2="520.8418" y1="449.4229" y2="462.4229"/><line style="stroke:#181818;stroke-width:1.0;" x1="479.8418" x2="520.8418" y1="462.4229" y2="462.4229"/><polygon fill="#181818" points="489.8418,458.4229,479.8418,462.4229,489.8418,466.4229,485.8418,462.4229" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.5601" x="485.8418" y="444.2871">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.7568" x="497.4019" y="444.2871">let it come up at the plan's rate</text><path d="M411.9951,491.4229 L477.9233,491.4229 L477.9233,499.1523 L467.9233,509.1523 L411.9951,509.1523 L411.9951,491.4229 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="310.875" style="stroke:#000000;stroke-width:1.5;" width="657.5986" x="411.9951" y="491.4229"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.9282" x="426.9951" y="505.0166">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="243.0259" x="492.9233" y="504.0791">[clutch fully in and plan.downshift_share &gt; 0]</text><line style="stroke:#181818;stroke-width:1.0;" x1="478.8418" x2="520.8418" y1="530.8818" y2="530.8818"/><line style="stroke:#181818;stroke-width:1.0;" x1="520.8418" x2="520.8418" y1="530.8818" y2="543.8818"/><line style="stroke:#181818;stroke-width:1.0;" x1="479.8418" x2="520.8418" y1="543.8818" y2="543.8818"/><polygon fill="#181818" points="489.8418,539