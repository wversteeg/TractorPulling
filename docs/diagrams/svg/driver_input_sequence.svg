EE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="136.918" style="stroke:#000000;stroke-width:1.5;" width="512.375" x="411.9951" y="239.7363"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.9282" x="426.9951" y="253.3301">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="238.1973" x="492.9233" y="252.3926">[plan.launch_hold_share &gt; 0 (a held launch)]</text><path d="M421.9951,264.4658 L482.8262,264.4658 L482.8262,272.1953 L472.8262,282.1953 L421.9951,282.1953 L421.9951,264.4658 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="105.1885" style="stroke:#000000;stroke-width:1.5;" width="492.375" x="421.9951" y="264.4658"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="436.9951" y="278.0596">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="411.5439" x="497.8262" y="277.1221">[engine &lt; launch_hold_share x rated speed and held_s &lt; launch_hold_max_s]</text><line style="stroke:#181818;stroke-width:1.0;" x1="478.8418" x2="520.8418" y1="303.9248" y2="303.9248"/><line style="stroke:#181818;stroke-width:1.0;" x1="520.8418" x2="520.8418" y1="303.9248" y2="316.9248"/><line style="stroke:#181818;stroke-width:1.0;" x1="479.8418" x2="520.8418" y1="316.9248" y2="316.9248"/><polygon fill="#181818" points="489.8418,312.9248,479.8418,316.9248,489.8418,320.9248,485.8418,316.9248" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.7915" x="485.8418" y="298.7891">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.0215" x="498.6333" y="298.7891">ease the clutch back at