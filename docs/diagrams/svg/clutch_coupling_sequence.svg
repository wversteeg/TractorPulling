002">Caller</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.4385" x="12" y="809.6396">(tool or test; later the vehicle step)</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="58.8438" x="468.0103" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.8438" x="475.0103" y="80.4414">engine</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="58.8438" x="468.0103" y="772.1377"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.8438" x="475.0103" y="792.7002">engine</text><rect fill="#E2E2F0" height="47.8789" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="215.8926" x="536.854" y="42.9395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.4785" x="616.561" y="63.502">driveline</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="201.8926" x="543.854" y="80.4414">(stand-in flywheel until step 3)</text><rect fill="#E2E2F0" height="47.8789" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="215.8926" x="536.854" y="772.1377"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.4785" x="616.561" y="792.7002">driveline</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="201.8926" x="543.854" y="809.6396">(stand-in flywheel until step 3)</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="91.2939" x="762.7466" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.2939" x="769.7466" y="80.4414">clutch::step</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="91.2939" x="762.7466" y="772.1377"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.2939" x="769.7466" y="792.7002">clutch::step</text><polygon fill="#181818" points="485.4321,119.5479,495.4321,123.5479,485.4321,127.5479,489.4321,123.5479" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.7192" x2="491.4321" y1="123.5479" y2="123.5479"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="5.605" x="132.7192" y="118.4121">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.7241" x="142.3242" y="118.4121">predict(state, params, throttle, dt_s)</text><polygon fill="#181818" points="136.7192,149.2773,126.7192,153.2773,136.7192,157.2773,132.7192,153.2773" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="130.7192" x2="496.4321" y1="153.2773" y2="153.2773"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.1885" x="142.7192" y="148.1416">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="62.188" x="154.9077" y="148.1416">Prediction</text><polygon fill="#181818" points="485.4321,179.0068,495.4321,183.0068,485.4321,187.0068,489.4321,183.0068" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.7192" x2="491.4321" y1="183.0068" y2="183.0068"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3916" x="132.7192" y="177.8711">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.0156" x="145.1108" y="177.8711">shaft_prediction(prediction)</text><polygon fill="#181818" points="136.7192,208.7363,126.7192,212.7363,136.7192,216.7363,132.7192,212.7363" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="130.7192" x2="496.4321" y1="212.7363" y2="212.7363"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.7915" x="142.7192" y="207.6006">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.1616" x="155.5107" y="207.6006">omega_e' = free_e + k_e * applied</text><polygon fill="#181818" points="632.8003,238.4658,642.8003,242.4658,632.8003,246.4658,636.8003,242.4658" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.7192" x2="638.8003" y1="242.4658" y2="242.4658"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3091" x="132.7192" y="237.3301">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="77.708" x="145.0283" y="237.3301">predict(dt_s)</text><polygon fill="#181818" points="136.7192,268.1953,126.7192,272.1953,136.7192,276.1953,132.7192,272.1953" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="130.7192" x2="643.8003" y1="272.1953" y2="272.1953"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="142.7192" y="267.0596">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.3042" x="155.1616" y="267.0596">omega_d' = free_d + k_d * applied</text><polygon fill="#181818" points="796.3936,297.9248,806.3936,301.9248,796.3936,305.9248,800.3936,301.9248" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.7192" x2="802.3936" y1="301.9248" y2="301.9248"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.5601" x="132.7192" y="296.7891">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.7637" x="144.2793" y="296.7891">step(state, params, {pedal}, engine_side, driveline_side)</text><line style="stroke:#181818;stroke-width:1.0;" x1="808.3936" x2="850.3936" y1="331.6543" y2="331.6543"/><line style="stroke:#181818;stroke-width:1.0;" x1="850.3936" x2="850.3936" y1="331.6543" y2="344.6543"/><line style="stroke:#181818;stroke-width:1.0;" x1="809.3936" x2="850.3936" y1="344.6543" y2="344.6543"/><polygon fill="#181818" points="819.3936,340.6543,809.3936,344.6543,819.3936,348.6543,815.3936,344.6543" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4614" x="815.3936" y="326.5186">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.5664" x="827.855" y="326.5186">capacity = engagement(pedal) * static_capacity</text><path d="M742.7466,359.6543 L803.5776,359.6543 L803.5776,367.3838 L793.5776,377.3838 L742.7466,377.3838 L742.7466,359.6543 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="255.8359" style="stroke:#000000;stroke-width:1.5;" width="440.5254" x="742.7466" y="359.6543"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="757.7466" y="373.248">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="169.2002" x="818.5776" y="372.3105">[capacity == 0 (pedal pressed)]</text><line style="stroke:#181818;stroke-width:1.0;" x1="808.3936" x2="850.3936" y1="399.1133" y2="399.1133"/><line style="stroke:#181818;stroke-width:1.0;" x1="850.3936" x2="850.3936" y1="399.1133" y2="412.1133"/><line style="stroke:#181818;stroke-width:1.0;" x1="809.3936" x2="850.3936" y1="412.1133" y2="412.1133"/><polygon fill="#181818" points="819.3936,408.1133,809.3936,412.1133,819.3936,416.1133,815.3936,412.1133" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="815.3936" y="393.9775">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.0957" x="827.8359" y="393.9775">torque = 0, unlocked</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="742.7466" x2="1183.272" y1="421.1133" y2="421.1133"/><line style="stroke:#181818;stroke-width:1.0;" x1="808.3936" x2="850.3936" y1="459.5723" y2="459.5723"/><line style="stroke:#181818;stroke-width:1.0;" x1="850.3936" x2="850.3936" y1="459.5723" y2="472.5723"/><line style="stroke:#181818;stroke-width:1.0;" x1="809.3936" x2="850.3936" y1="472.5723" y2="472.5723"/><polygon fill="#181818" points="819.3936,468.5723,809.3936,472.5723,819.3936,476.5723,815.3936,472.5723" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.3711" x="815.3936" y="446.5718">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.4746" x="833.7646" y="438.707">lock_torque = (free_e - free_d) / (k_e + k_d)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.0674" x="833.7646" y="454.4365">(torque that matches speeds at end of step)</text><path d="M752.7466,487.5723 L813.5776,487.5723 L813.5776,495.3018 L803.5776,505.3018 L752.7466,505.3018 L752.7466,487.5723 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="120.918" style="stroke:#000000;stroke-width:1.5;" width="420.5254" x="752.7466" y="487.5723"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="767.7466" y="501.166">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="279.8125" x="828.5776" y="500.2285">[|lock_torque| &lt;= (locked ? static : kinetic) capacity]</text><line style="stroke:#181818;stroke-width:1.0;" x1="808.3936" x2="850.3936" y1="527.0313" y2="527.0313"/><line style="stroke:#181818;stroke-width:1.0;" x1="850.3936" x2="850.3936" y1="527.0313" y2="540.0313"/><line style="stroke:#181818;stroke-width:1.0;" x1="809.3936" x2="850.3936" y1="540.0313" y2="540.0313"/><polygon fill="#181818" points="819.3936,536.0313,809.3936,540.0313,819.3936,544.0313,815.3936,540.0313" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="11.21" x="815.3936" y="521.8955">11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.1284" x="830.6035" y="521.8955">torque = lock_torque, locked</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="752.7466" x2="1173.272" y1="549.0313" y2="549.0313"/><line style="stroke:#181818;stroke-width:1.0;" x1="808.3936" x2="850.3936" y1="587.4902" y2="587.4902"/><line style="stroke:#181818;stroke-width:1.0;" x1="850.3936" x2="850.3936" y1="587.4902" y2="600.4902"/><line style="stroke:#181818;stroke-width:1.0;" x1="809.3936" x2="850.3936" y1="600.4902" y2="600.4902"/><polygon fill="#181818" points="819.3936,596.4902,809.3936,600.4902,819.3936,604.4902,815.3936,600.4902" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.7935" x="815.3936" y="574.4897">12</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.085" x="833.187" y="566.625">torque = sign(lock_torque) * kinetic capacity, slipping</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.9395" x="833.187" y="582.3545">slip_power = torque * slip</text><polygon fill="#181818" points="136.7192,640.2197,126.7192,644.2197,136.7192,648.2197,132.7192,644.2197" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="130.7192" x2="807.3936" y1="644.2197" y2="644.2197"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.9966" x="142.7192" y="639.084">13</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.4795" x="160.7158" y="639.084">Output {torque_nm, slip_rad_s, slip_power_w, capacity_nm}</text><polygon fill="#181818" points="485.4321,669.9492,495.4321,673.9492,485.4321,677.9492,489.4321,673.9492" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.7192" x2="491.4321" y1="673.9492" y2="673.9492"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.3965" x="132.7192" y="668.8135">14</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.3164" x="151.1157" y="668.8135">advance(state, params, prediction, load = torque_nm)</text><polygon fill="#181818" points="632.8003,699.6787,642.8003,703.6787,632.8003,707.6787,636.8003,703.6787" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.7192" x2="638.8003" y1="703.6787" y2="703.6787"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.9141" x="132.7192" y="698.543">15</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.2065" x="