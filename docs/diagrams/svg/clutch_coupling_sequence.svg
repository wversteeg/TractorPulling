.1592">Caller</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.4385" x="12" y="868.0986">(tool or test; later the vehicle step)</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="58.8438" x="467.5278" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.8438" x="474.5278" y="80.4414">engine</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="58.8438" x="467.5278" y="830.5967"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.8438" x="474.5278" y="851.1592">engine</text><rect fill="#E2E2F0" height="47.8789" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="215.8926" x="536.3716" y="42.9395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.4785" x="616.0786" y="63.502">driveline</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="201.8926" x="543.3716" y="80.4414">(stand-in flywheel until step 3)</text><rect fill="#E2E2F0" height="47.8789" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="215.8926" x="536.3716" y="830.5967"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.4785" x="616.0786" y="851.1592">driveline</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="201.8926" x="543.3716" y="868.0986">(stand-in flywheel until step 3)</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="91.2939" x="762.2642" y="59.8789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.2939" x="769.2642" y="80.4414">clutch::step</text><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="91.2939" x="762.2642" y="830.5967"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.2939" x="769.2642" y="851.1592">clutch::step</text><polygon fill="#181818" points="484.9497,119.5479,494.9497,123.5479,484.9497,127.5479,488.9497,123.5479" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.7192" x2="490.9497" y1="123.5479" y2="123.5479"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="5.605" x="132.7192" y="118.4121">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.7241" x="142.3242" y="118.4121">predict(state, params, throttle, dt_s)</text><polygon fill="#181818" points="136.7192,149.2773,126.7192,153.2773,136.7192,157.2773,132.7192,153.2773" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="130.7192" x2="495.9497" y1="153.2773" y2="153.2773"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.1885" x="142.7192" y="148.1416">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="62.188" x="154.9077" y="148.1416">Prediction</text><polygon fill="#181818" points="484.9497,179.0068,494.9497,183.0068,484.9497,187.0068,488.9497,183.0068" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.7192" x2="490.9497" y1="183.0068" y2="183.0068"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3916" x="132.7192" y="177.8711">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.0156" x="145.1108" y="177.8711">shaft_prediction(prediction)</text><polygon fill="#181818" points="136.7192,208.7363,126.7192,212.7363,136.7192,216.7363,132.7192,212.7363" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="130.7192" x2="495.9497" y1="212.7363" y2="212.7363"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.7915" x="142.7192" y="207.6006">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.1616" x="155.5107" y="207.6006">omega_e' = free_e + k_e * applied</text><polygon fill="#181818" points="632.3179,238.4658,642.3179,242.4658,632.3179,246.4658,636.3179,242.4658" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.7192" x2="638.3179" y1="242.4658" y2="242.4658"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3091" x="132.7192" y="237.3301">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="77.708" x="145.0283" y="237.3301">predict(dt_s)</text><polygon fill="#181818" points="136.7192,268.1953,126.7192,272.1953,136.7192,276.1953,132.7192,272.1953" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="130.7192" x2="643.3179" y1="272.1953" y2="272.1953"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="142.7192" y="267.0596">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.3042" x="155.1616" y="267.0596">omega_d' = free_d + k_d * applied</text><polygon fill="#181818" points="795.9111,297.9248,805.9111,301.9248,795.9111,305.9248,799.9111,301.9248" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.7192" x2="801.9111" y1="301.9248" y2="301.9248"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.5601" x="132.7192" y="296.7891">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.7637" x="144.2793" y="296.7891">step(state, params, {pedal}, engine_side, driveline_side)</text><line style="stroke:#181818;stroke-width:1.0;" x1="807.9111" x2="849.9111" y1="331.6543" y2="331.6543"/><line style="stroke:#181818;stroke-width:1.0;" x1="849.9111" x2="849.9111" y1="331.6543" y2="344.6543"/><line style="stroke:#181818;stroke-width:1.0;" x1="808.9111" x2="849.9111" y1="344.6543" y2="344.6543"/><polygon fill="#181818" points="818.9111,340.6543,808.9111,344.6543,818.9111,348.6543,814.9111,344.6543" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4614" x="814.9111" y="326.5186">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.5664" x="827.3726" y="326.5186">capacity = engagement(pedal) * static_capacity</text><path d="M742.2642,359.6543 L803.0952,359.6543 L803.0952,367.3838 L793.0952,377.3838 L742.2642,377.3838 L742.2642,359.6543 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="314.2949" style="stroke:#000000;stroke-width:1.5;" width="440.7285" x="742.2642" y="359.6543"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="757.2642" y="373.248">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="169.2002" x="818.0952" y="372.3105">[capacity == 0 (pedal pressed)]</text><line style="stroke:#181818;stroke-width:1.0;" x1="807.9111" x2="849.9111" y1="399.1133" y2="399.1133"/><line style="stroke:#181818;stroke-width:1.0;" x1="849.9111" x2="849.9111" y1="399.1133" y2="412.1133"/><line style="stroke:#181818;stroke-width:1.0;" x1="808.9111" x2="849.9111" y1="412.1133" y2="412.1133"/><polygon fill="#181818" points="818.9111,408.1133,808.9111,412.1133,818.9111,416.1133,814.9111,412.1133" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="814.9111" y="393.9775">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.0957" x="827.3535" y="393.9775">torque = 0, unlocked</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="742.2642" x2="1182.9927" y1="421.1133" y2="421.1133"/><line style="stroke:#181818;stroke-width:1.0;" x1="807.9111" x2="849.9111" y1="459.5723" y2="459.5723"/><line style="stroke:#181818;stroke-width:1.0;" x1="849.9111" x2="849.9111" y1="459.5723" y2="472.5723"/><line style="stroke:#181818;stroke-width:1.0;" x1="808.9111" x2="849.9111" y1="472.5723" y2="472.5723"/><polygon fill="#181818" points="818.9111,468.5723,808.9111,472.5723,818.9111,476.5723,814.9111,472.5723" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.3711" x="814.9111" y="446.5718">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.0415" x="833.2822" y="438.707">k_e, k_d = each side's response for the torque's sign</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.6572" x="833.2822" y="454.4365">(the sign of free_e - free_d)</text><line style="stroke:#181818;stroke-width:1.0;" x1="807.9111" x2="849.9111" y1="518.0313" y2="518.0313"/><line style="stroke:#181818;stroke-width:1.0;" x1="849.9111" x2="849.9111" y1="518.0313" y2="531.0313"/><line style="stroke:#181818;stroke-width:1.0;" x1="808.9111" x2="849.9111" y1="531.0313" y2="531.0313"/><polygon fill="#181818" points="818.9111,527.0313,808.9111,531.0313,818.9111,535.0313,814.9111,531.0313" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="11.21" x="814.9111" y="505.0308">11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.4746" x="830.1211" y="497.166">lock_torque = (free_e - free_d) / (k_e + k_d)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.0674" x="830.1211" y="512.8955">(torque that matches speeds at end of step)</text><path d="M752.2642,546.0313 L813.0952,546.0313 L813.0952,553.7607 L803.0952,563.7607 L752.2642,563.7607 L752.2642,546.0313 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="120.918" style="stroke:#000000;stroke-width:1.5;" width="420.7285" x="752.2642" y="546.0313"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="767.2642" y="559.625">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="279.8125" x="828.0952" y="558.6875">[|lock_torque| &lt;= (locked ? static : kinetic) capacity]</text><line style="stroke:#181818;stroke-width:1.0;" x1="807.9111" x2="849.9111" y1="585.4902" y2="585.4902"/><line style="stroke:#181818;stroke-width:1.0;" x1="849.9111" x2="849.9111" y1="585.4902" y2="598.4902"/><line style="stroke:#181818;stroke-width:1.0;" x1="808.9111" x2="849.9111" y1="598.4902" y2="598.4902"/><polygon fill="#181818" points="818.9111,594.4902,808.9111,598.4902,818.9111,602.4902,814.9111,598.4902" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.7935" x="814.9111" y="580.3545">12</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.1284" x="832.7046" y="580.3545">torque = lock_torque, locked</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="752.2642" x2="1172.9927" y1="607.4902" y2="607.4902"/><line style="stroke:#181818;stroke-width:1.0;" x1="807.9111" x2="849.9111" y1="645.9492" y2="645.9492"/><line style="stroke:#181818;stroke-width:1.0;" x1="849.9111" x2="849.9111" y1="645.9492" y2="658.9492"/><line style="stroke:#181818;stroke-width:1.0;" x1="808.9111" x2="849.9111" y1="658.9492" y2="658.9492"/><polygon fill="#181818" points="818.9111,654.9492,808.9111,658.9492,818.9111,662.9492,814.9111,658.9492" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.9966" x="814.9111" y="632.9487">13</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.085" x="832.9077" y="625.084">torque = sign(lock_torque) * kinetic capacity, slipping</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.9395" x="832.9077" y="640.8135">slip_power = torque * slip</text><polygon fill="#181818" points="136.7192,698.6787,126.7192,702.6787,136.7192,706.6787,132.7192,702.6787" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="130.7192" x2="806.9111" y1="702.6787" y2="702.6787"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.3965" x="142.7192" y="697.543">14</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.4795" x="161.1157" y="697.543">Output {torque_nm, slip_rad_s, slip_power_w, capacity_nm}</text><polygon fill="#181818" points="484.9497,728.4082,494.9497,732.4082,484.9497,736.4082,488.9497,732.4082" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.7192" x2="490.9497" y1="732.4082" y2="732.4082"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13.9141" x="132.7192" y="727.2725">15</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.3164" x="150.6333" y="727.2725">advance(state, params, prediction, load = torque_nm)</text><polygon fill="#181818" points="632.3179,758.1377,642.3179,762.1377,632.3179,766.1377,636.3179,762.1377" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="125.7192" x2="638.3179" y1="762.1377" y2="762.1377"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.0474" x="132.7192" y="757.002">16</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.2065" x="150.7666" y="757.002">advance(dt_s, +torque_nm)</text><path d="M408,775.1377 L408,816.1377 L585,816.1377 L585,785.1377 L575,775.1377 L408,775.1377 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M575,775.1377 L575,785.1377 L585,785.1377 L575,775.1377 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.0454" x="414" y="792.7314">stalls here if the clutch</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.7871" x="414" y="808.4609">drags it below stall speed</text><!--SRC=[VLJ1Rjim3BtxAuXU6hSErc6tRDaEsu3TjWy8OAWMOmkH9SsY4tHj_tsKP3jEuFQGH978znwVI94YZV3JrCfW0PNkgMf060coKqVKl0lAWEMVZt3uzGyyeSj4JzRqxIDscHCTgKevOGXklWkjiTkP5LchmNP0wEapQ478wmRXY8sgc2-Wv3SWFAIKInYCQk9n4dPvF2bZ8a-iTSqAz_hfr21gw0qf7GdWKwBuCSPVmgHQDviGcgJ4ZInBac3zTM273RWEfQeeq17Rn3YYzGMNr5bY_mgGLFey6-BNd3g0RE1FIbNMB07xHkofT5FCwhnSXhCjrgB4MzZ2laCi4UxXmDzt89pJ2kMC