ans-serif" font-size="13" lengthAdjust="spacing" textLength="158.6597" x="453.5957" y="301.5186">keep: the test pull counts;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.1768" x="453.5957" y="317.248">re-pull: queued after the 6th pull</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="20" x2="886.4175" y1="344.3838" y2="344.3838"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="83.4829" x="25" y="355.04">[next() is a pull]</text><polygon fill="#181818" points="421.8042,376.4229,431.8042,380.4229,421.8042,384.4229,425.8042,380.4229" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="102.9829" x2="427.8042" y1="380.4229" y2="380.4229"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3091" x="109.9829" y="375.2871">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.396" x="122.292" y="375.2871">next(), sled(), full_pull_m()</text><polygon fill="#181818" points="807.9937,437.6113,817.9937,441.6113,807.9937,445.6113,811.9937,441.6113" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="102.9829" x2="813.9937" y1="441.6113" y2="441.6113"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.4424" x="109.9829" y="420.7461">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.7588" x="122.4253" y="405.0166">run the puller (a little different each pull)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.3442" x="122.4253" y="420.7461">on sled() until the sled stops, or reaches the full-pull line</text><text fill="#000000" font-family="sans-se