; The game's exports (scripts/godot_export.sh, CI's export job): a debug APK
; for phones and the emulator (arm64-v8a and x86_64), signed with a debug
; key, the Windows desktop game, and the web game. All carry the extension's debug
; libraries (tractor_pulling.gdextension) and the data files, which are not
; Godot resources and so are named in include_filter; the tests and tools
; are left out. The icons are drawn by tools/make_icons.gd.

