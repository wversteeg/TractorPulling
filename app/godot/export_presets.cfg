; The game's exports (scripts/godot_export.sh, CI's export job): a debug APK
; for phones and the emulator (arm64-v8a and x86_64), signed with a debug
; key, and the Windows desktop game. Both carry the extension's debug
; libraries (tractor_pulling.gdextension) and the data files, which are not
; Godot resources and so are named in include_filter; the tests are left out.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.toml"
exclude_filter="tests/*"
export_path="../../build/export/tractor_pulling.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
