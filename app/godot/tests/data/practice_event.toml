# The club event on the practice sled, for the flow test (see
# practice_sled.toml), with a small field in the game and two gears to try,
# so the test plays quickly; otherwise as data/events/club_pull.toml.

[event]
class = "../../data/classes/ntto_standard_3500.toml"
tractor = "../../data/tractors/farm_stock_light.toml"   # the reference the field varies
sled = "practice_sled.toml"
track = "../../data/tracks/ideal_clay_sand.toml"
pullers = 15
seed = 2026

# The reference driver: neutral, the gear in at 0.5 s, rev up, then the
# clutch up over 3 s from 3 s; a gear down under load once the sled pulls
# the engine below 90 % of its rated speed (0 would never shift).
[event.driver]
gear = 6
select_gear_s = 0.5
launch_s = 3.0
clutch_slip_in_s = 3.0
downshift_share = 0.9

# How the pullers differ. Power and weight are kept within the class. Each
# driver picks a gear between `gears` for the day's track: the best one as
# often as their track_reading says, otherwise one off. Each shifts down at
# their own engine speed. And no two pulls are the same: the spot on the
# track and the driver's timing differ a little.
[event.field]
torque_scale = [0.95, 1.03]
mass_kg = [3300.0, 3550.0]
traction_limit = [0.90, 0.95]
gears = [5, 6]
clutch_slip_in_s = [2.0, 4.0]
track_reading = [0.5, 0.95]
downshift_share = [0.82, 0.95]         # of the rated speed, as the driver above
pull_to_pull_grip_share = 0.01         # +- 1 % grip
pull_to_pull_clutch_slip_in_s = 0.3    # +- 0.3 s

# The NTTO's competition rules and the sled operator's rule of thumb.
[event.rules]
full_pull_m = 100.0
extended_full_pull_m = 110.0     # when a test pull stops between the two
max_distance_m = 130.0           # a pull past the line stops here at the latest
pull_off_places = 4              # full pulls, filled up with the best...
qualifying_distance_m = 90.0     # ...from 90 m on
decide_after_pulls = 2           # the test puller decides after the 3rd pull
repull_after_pulls = 5           # and re-pulls after the 6th
sled_target_m = 94.0             # a shorter test pull: the sled goes lighter, so a couple of the best make full pulls
step_m = 5.0                     # rule of thumb: a sled step is worth about 5 m (learnt better on the day)
max_steps_per_change = 4         # at most this many steps at once

# The event in the game: the player and three rivals.
[event.game]
pullers = 4
rival_names = ["Henk", "Gerrit", "Annemiek"]
